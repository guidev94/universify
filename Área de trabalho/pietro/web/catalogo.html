<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catálogo | M. PIETRO - Brindes e Personalizados Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --accent: #09090b;
            --bg: #fafafa;
            --surface: #ffffff;
            --text-main: #09090b;
            --text-muted: #71717a;
        }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text-main); }
        .glass-nav { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(24px); 
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
        }
        .premium-card {
            background: var(--surface);
            border: 1px solid rgba(9, 9, 11, 0.05);
            border-radius: 2.5rem;
            padding: 1.25rem;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            height: 100%;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.01);
        }
        .premium-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 40px 100px -20px rgba(0,0,0,0.1);
            border-color: rgba(9, 9, 11, 0.1);
        }
        .img-box {
            background: #f9f9f9;
            border-radius: 1.5rem;
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 1.5rem;
            padding: 1.5rem;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .section-bleed { width: 100%; padding: 0 1.5rem; max-width: 1440px; margin: 0 auto; }
        
        .cat-btn {
            text-align: left;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            padding: 0.5rem 0;
            transition: all 0.3s ease;
            border-bottom: 2px solid transparent;
            width: fit-content;
        }
        .cat-btn.active {
            color: var(--text-main);
            border-bottom-color: var(--text-main);
            padding-left: 0.5rem;
        }
    </style>
</head>
<body class="antialiased pt-32">

    <!-- Header -->
    <nav class="fixed top-0 w-full z-[100] glass-nav py-6" id="navbar">
        <div class="section-bleed flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-4 cursor-pointer group">
                <div class="w-12 h-12 bg-black rounded-xl flex items-center justify-center text-white font-black text-2xl group-hover:rotate-12 transition-transform shadow-xl">M</div>
                <div class="hidden md:flex flex-col leading-none border-l border-zinc-200 pl-5 text-zinc-950">
                    <span class="font-black tracking-tighter text-xl uppercase text-zinc-950">M. PIETRO</span>
                    <span class="text-[9px] uppercase tracking-[0.4em] text-zinc-400 font-bold">Brindes & Personalizados</span>
                </div>
            </a>
            
            <div class="hidden lg:flex items-center gap-14 text-[10px] font-black uppercase tracking-[0.3em] text-zinc-400">
                <a href="index.html" class="hover:text-black transition-colors">Home</a>
                <a href="catalogo.html" class="text-black underline underline-offset-8 decoration-2">Catálogo</a>
                <a href="sobre.html" class="hover:text-black transition-colors">Curadoria</a>
                <a href="contato.html" class="hover:text-black transition-colors">Contato</a>
            </div>

            <div class="flex items-center gap-8">
                <button onclick="toggleCart()" class="relative p-2 text-black hover:scale-110 transition-transform">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"></path></svg>
                    <span id="cartCount" class="absolute -top-1 -right-1 bg-black text-white text-[9px] font-black w-5 h-5 rounded-full flex items-center justify-center border-2 border-white hidden">0</span>
                </button>
            </div>
        </div>
    </nav>


    <div class="section-bleed flex flex-col lg:flex-row gap-20 mb-40">
        <!-- Sidebar -->
        <aside class="lg:w-80 flex-shrink-0">
            <div class="sticky top-40 space-y-16">
                <div>
                    <h3 class="text-[11px] font-black uppercase tracking-[0.5em] text-zinc-300 mb-10">Coleções</h3>
                    <div id="categoriesList" class="flex flex-col gap-4 max-h-[50vh] overflow-y-auto no-scrollbar pr-6">
                        <button onclick="setCategory('', this)" class="text-left text-xs font-black uppercase tracking-widest text-black border-b-2 border-black pb-2 w-fit mb-4">Ver Todas</button>
                    </div>
                </div>
                <div>
                    <h3 class="text-[11px] font-black uppercase tracking-[0.5em] text-zinc-300 mb-10">Search</h3>
                    <div class="relative">
                        <input type="text" id="catalogSearch" placeholder="Nome ou SKU..." class="w-full bg-zinc-50 border-none rounded-3xl px-8 py-6 text-sm font-semibold outline-none focus:ring-2 focus:ring-black transition-all">
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main -->
        <main class="flex-1">
            <div class="flex items-center justify-between mb-20">
                <h1 class="text-5xl md:text-7xl font-black tracking-tighter uppercase italic text-zinc-950">Catálogo.</h1>
                <div id="resultsCount" class="text-[10px] font-black uppercase tracking-[0.3em] text-zinc-300">Aguardando...</div>
            </div>

            <div id="productsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12">
                <!-- Skeletons... -->
            </div>

            <div class="mt-32 text-center">
                <button id="loadMore" class="group relative inline-flex items-center gap-6 px-16 py-8 bg-zinc-950 text-white rounded-full font-black uppercase tracking-[0.2em] text-[10px] hover:bg-zinc-800 transition-all shadow-2xl">Carregar Mais</button>
            </div>
        </main>
    </div>

    <!-- Cart Sidebar -->
    <div id="cartSidebar" class="fixed inset-y-0 right-0 z-[300] w-full max-w-lg bg-white shadow-[-50px_0_100px_rgba(0,0,0,0.1)] translate-x-full transition-transform duration-700 flex flex-col">
        <div class="p-12 border-b border-zinc-100 flex items-center justify-between">
            <h3 class="text-4xl font-black tracking-tighter uppercase italic text-zinc-200 italic">Draft</h3>
            <button onclick="toggleCart()" class="w-12 h-12 bg-zinc-50 rounded-full flex items-center justify-center hover:bg-zinc-100 transition-colors"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg></button>
        </div>
        <div id="cartItems" class="flex-1 overflow-y-auto p-12 space-y-12 no-scrollbar"></div>
        <div class="p-12 border-t border-zinc-100"><button onclick="sendToWhatsApp()" class="w-full bg-black text-white py-8 rounded-[40px] font-black uppercase tracking-widest text-[11px] shadow-2xl">Solicitar via WhatsApp</button></div>
    </div>

    <script>
        const imageBaseUrl = 'https://www.spotgifts.com.br/fotos/produtos/';
        let offset = 0;
        let limit = 12;
        let category = '';
        let query = '';
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');

        function getProp(obj, prop) {
            if (!obj) return '';
            const key = Object.keys(obj).find(k => k.toLowerCase() === prop.toLowerCase());
            return key ? obj[key] : '';
        }

        async function fetchApi(endpoint, params = {}) {
            const url = new URL('api/proxy.php', window.location.href.split('/').slice(0,-1).join('/') + '/');
            url.searchParams.set('endpoint', endpoint);
            for(const [k,v] of Object.entries(params)) url.searchParams.set(k, v);
            const res = await fetch(url);
            return await res.json();
        }

        async function loadCategories() {
            const cats = await fetchApi('categories');
            const container = document.getElementById('categoriesList');
            if(cats) cats.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = "text-left text-[11px] font-black uppercase tracking-widest text-zinc-400 hover:text-black transition-all";
                btn.textContent = cat;
                btn.onclick = () => setCategory(cat, btn);
                container.appendChild(btn);
            });
        }

        async function loadProducts(reset = true) {
            const grid = document.getElementById('productsGrid');
            if (reset) { offset = 0; grid.innerHTML = ''; }
            
            const data = await fetchApi('search', { q: query, cat: category, offset, limit });
            if (!data || data.length === 0) {
                if(reset) grid.innerHTML = '<div class="col-span-full py-40 text-center text-zinc-100 font-black uppercase tracking-[1em] text-2xl opacity-50">Empty</div>';
                document.getElementById('loadMore').style.display = 'none';
                return;
            }

            data.forEach(p => {
                const name = getProp(p, 'name');
                const ref = getProp(p, 'prod_reference');
                const imgName = getProp(p, 'main_image');
                const brand = getProp(p, 'brand');
                const subType = getProp(p, 'sub_type') || getProp(p, 'type');
                const img = imgName ? (imageBaseUrl + imgName) : 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&q=80&w=400';
                
                const card = document.createElement('a');
                card.href = `produto.html?sku=${ref}`;
                card.className = 'premium-card group block';
                card.innerHTML = `
                    <div class="img-box">
                        <img src="${img}" class="w-full h-full object-contain mix-blend-multiply transition-transform duration-1000 group-hover:scale-110" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&q=80&w=400'">
                    </div>
                    <div>
                        <div class="text-[9px] font-black uppercase tracking-[0.4em] text-zinc-300 mb-4">${subType || 'Luxury Gift'}</div>
                        <h4 class="font-black text-xl lg:text-2xl tracking-tighter text-zinc-950 mb-6 line-clamp-1 uppercase leading-none group-hover:text-zinc-500 transition-colors">${name}</h4>
                        <div class="flex items-center justify-between pt-6 border-t border-zinc-50">
                            <span class="text-[10px] font-black uppercase tracking-widest text-zinc-950">REF: ${ref}</span>
                            <div class="w-12 h-12 bg-zinc-50 rounded-full flex items-center justify-center group-hover:bg-black group-hover:text-white transition-all shadow-sm"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 4.5v15m7.5-7.5h-15"></path></svg></div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            document.getElementById('loadMore').style.display = data.length < limit ? 'none' : 'inline-flex';
            document.getElementById('resultsCount').textContent = `Showing ${grid.children.length} Items`;
        }

        function setCategory(cat, btn) {
            category = cat;
            document.querySelectorAll('#categoriesList button').forEach(b => b.classList.remove('text-black', 'border-b-2', 'border-black'));
            if(btn) {
                btn.classList.add('text-black', 'border-b-2', 'border-black');
                btn.classList.remove('text-zinc-400');
            }
            loadProducts(true);
        }

        document.getElementById('catalogSearch').oninput = (e) => { query = e.target.value; loadProducts(true); };
        document.getElementById('loadMore').onclick = () => loadProducts(false);

        function updateCartUI() {
            const b = document.getElementById('cartCount');
            if (b) { b.textContent = cart.length; b.classList.toggle('hidden', cart.length === 0); }
            const c = document.getElementById('cartItems');
            if (!c) return;
            c.innerHTML = cart.length === 0 ? '<div class="h-full flex items-center justify-center text-zinc-100 font-black uppercase tracking-[1em] opacity-30 italic">Empty</div>' : '';
            cart.forEach((item, idx) => {
                const d = document.createElement('div');
                d.className = 'flex items-center gap-10';
                d.innerHTML = `<div class="w-24 h-24 bg-zinc-50 rounded-[35px] overflow-hidden flex-shrink-0 border border-zinc-100 p-6 flex items-center justify-center"><img src="${item.img}" class="w-full h-full object-contain mix-blend-multiply"></div><div class="flex-1"><h4 class="text-xs font-black mb-2 uppercase leading-tight">${item.name}</h4><div class="text-[9px] font-bold text-zinc-400 uppercase tracking-widest">${item.id} • ${item.qty} UN</div></div><button onclick="removeFromCart(${idx})" class="text-zinc-200 hover:text-red-500 transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>`;
                c.appendChild(d);
            });
        }
        function removeFromCart(i) { cart.splice(i, 1); localStorage.setItem('cart', JSON.stringify(cart)); updateCartUI(); }
        function toggleCart() { document.getElementById('cartSidebar').classList.toggle('translate-x-full'); }
        function sendToWhatsApp() {
            if (cart.length === 0) return;
            let t = "Olá! Gostaria de um orçamento para brindes corporativos:\n\n";
            cart.forEach(it => t += `• ${it.name} (${it.id}) - Qtd: ${it.qty}\n`);
            window.open(`https://wa.me/5511987654321?text=${encodeURIComponent(t)}`);
        }

        loadCategories();
        loadProducts();
        updateCartUI();
    </script>
</body>
</html>
