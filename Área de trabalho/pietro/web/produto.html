<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M. PIETRO | Brindes & Personalizados Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #fafafa; --surface: #ffffff; --text-main: #09090b; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text-main); }
        .glass-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0, 0, 0, 0.05); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Custom scrollbar */
        .content-scroll { scrollbar-width: thin; scrollbar-color: #000 #f4f4f5; }
        .content-scroll::-webkit-scrollbar { width: 6px; }
        .content-scroll::-webkit-scrollbar-track { background: #f4f4f5; }
        .content-scroll::-webkit-scrollbar-thumb { background-color: #000; border-radius: 20px; }

        .premium-card {
            background: var(--surface);
            border: 1px solid rgba(9, 9, 11, 0.05);
            border-radius: 2.5rem;
            padding: 1.25rem;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .premium-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 40px 100px -20px rgba(0,0,0,0.08);
            border-color: rgba(9, 9, 11, 0.1);
        }
        .thumb-gallery { border: 2px solid transparent; transition: all 0.3s ease; }
        .thumb-gallery.active { border-color: #000; transform: scale(1.05); }
        .section-bleed { width: 100%; padding: 0 1.5rem; max-width: 1440px; margin: 0 auto; }
    </style>
</head>
<body class="antialiased pt-40 content-scroll">

    <!-- Header -->
    <nav class="fixed top-0 w-full z-[100] glass-header py-6" id="navbar">
        <div class="section-bleed flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-4 cursor-pointer group">
                <div class="w-12 h-12 bg-black rounded-xl flex items-center justify-center text-white font-black text-2xl group-hover:rotate-12 transition-transform shadow-xl">M</div>
                <div class="hidden md:flex flex-col leading-none border-l border-zinc-200 pl-5 text-zinc-950">
                    <span class="font-black tracking-tighter text-xl uppercase text-zinc-950">M. PIETRO</span>
                    <span class="text-[9px] uppercase tracking-[0.4em] text-zinc-400 font-bold">Brindes & Personalizados</span>
                </div>
            </a>
            
            <div class="hidden lg:flex items-center gap-14 text-[10px] font-black uppercase tracking-[0.3em] text-zinc-400">
                <a href="index.html" class="hover:text-black transition-colors">Home</a>
                <a href="catalogo.html" class="hover:text-black transition-colors">Catálogo</a>
                <a href="sobre.html" class="hover:text-black transition-colors">Curadoria</a>
                <a href="contato.html" class="hover:text-black transition-colors">Contato</a>
            </div>

            <div class="flex items-center gap-6">
                <button onclick="toggleCart()" class="relative p-2 text-black hover:scale-110 transition-transform">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                    <span id="cartCount" class="absolute -top-1 -right-1 bg-black text-white text-[9px] font-black w-5 h-5 rounded-full flex items-center justify-center border-2 border-white hidden">0</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-[1400px] mx-auto px-6 lg:px-12 pb-32">
        <div id="productContainer" class="grid lg:grid-cols-2 gap-20 opacity-0 transition-opacity duration-700">
            <!-- Product Images -->
            <div class="space-y-8">
                <div class="rounded-[64px] bg-zinc-50 aspect-square overflow-hidden border border-zinc-100 flex items-center justify-center p-12">
                    <img id="mainImg" src="" alt="" class="w-full h-full object-contain mix-blend-multiply transition-transform hover:scale-105 duration-700">
                </div>
                <!-- Stricker often has one main image, but we can add placeholders if needed -->
            </div>

            <!-- Product Details -->
            <div class="flex flex-col justify-center">
                <div id="categoryLabel" class="text-[11px] font-black uppercase tracking-[0.4em] text-zinc-400 mb-6"></div>
                <h1 id="productName" class="text-4xl lg:text-6xl font-black tracking-tighter mb-8 leading-[1.1] text-zinc-950"></h1>
                <div id="skuLabel" class="inline-block bg-zinc-100 px-6 py-3 rounded-2xl text-xs font-black mb-10"></div>
                
                <p id="productDesc" class="text-lg text-zinc-500 font-medium leading-relaxed mb-12"></p>
                
                <div class="bg-zinc-50 rounded-[40px] p-10 space-y-10">
                    <div>
                        <label class="text-[11px] font-black uppercase tracking-widest text-zinc-400 mb-6 block">Quantidade para Orçamento</label>
                        <div class="flex items-center gap-6">
                            <button onclick="updateQty(-50)" class="w-16 h-16 rounded-[24px] border-2 border-zinc-200 flex items-center justify-center hover:border-black transition-colors font-black text-2xl">-</button>
                            <input type="number" id="qtyInput" value="100" min="1" class="w-32 h-16 text-center bg-white rounded-[24px] font-black border-none outline-none focus:ring-2 focus:ring-black text-xl">
                            <button onclick="updateQty(50)" class="w-16 h-16 rounded-[24px] border-2 border-zinc-200 flex items-center justify-center hover:border-black transition-colors font-black text-2xl">+</button>
                        </div>
                    </div>
                    
                    <button id="addBtn" class="w-full bg-black text-white py-8 rounded-[32px] font-black uppercase tracking-widest text-xs hover:bg-zinc-800 transition-all shadow-2xl flex items-center justify-center gap-4">
                        Adicionar ao Orçamento
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Related Products -->
        <div class="mt-44">
            <h3 class="text-3xl font-black tracking-tighter mb-12">Produtos Relacionados</h3>
            <div id="relatedGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-12">
                <!-- JS populated -->
            </div>
        </div>
    </div>

    <!-- Cart Sidebar -->
    <div id="cartSidebar" class="fixed inset-y-0 right-0 z-[300] w-full max-w-lg bg-white shadow-[-50px_0_100px_rgba(0,0,0,0.1)] translate-x-full transition-transform duration-700 flex flex-col">
        <div class="p-12 border-b border-zinc-100 flex items-center justify-between">
            <h3 class="text-4xl font-black tracking-tighter">Seu Orçamento</h3>
            <button onclick="toggleCart()" class="w-12 h-12 bg-zinc-50 rounded-full flex items-center justify-center hover:bg-zinc-100 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div id="cartItems" class="flex-1 overflow-y-auto p-12 space-y-10 no-scrollbar"></div>
        <div class="p-12 border-t border-zinc-100">
            <button onclick="sendToWhatsApp()" class="w-full bg-black text-white py-8 rounded-[32px] font-black uppercase tracking-widest text-[11px] hover:bg-zinc-800 transition-all shadow-2xl flex items-center justify-center gap-4">
                Finalizar no WhatsApp
            </button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sku = urlParams.get('sku');
        let currentProduct = null;
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        const imageBaseUrl = 'https://www.spotgifts.com.br/fotos/produtos/';

        function getProp(obj, prop) {
            if (!obj) return '';
            const key = Object.keys(obj).find(k => k.toLowerCase() === prop.toLowerCase());
            return key ? obj[key] : '';
        }

        async function fetchApi(endpoint, params = {}) {
            const baseUrl = window.location.href.split('/').slice(0,-1).join('/') + '/';
            const url = new URL('api/proxy.php', baseUrl);
            url.searchParams.set('endpoint', endpoint);
            for (const [key, value] of Object.entries(params)) {
                url.searchParams.set(key, value);
            }
            const res = await fetch(url);
            return await res.json();
        }

        async function init() {
            if (!sku) { window.location.href = 'catalogo.html'; return; }
            
            const product = await fetchApi('product', { sku });
            if (!product || product.error) { window.location.href = 'catalogo.html'; return; }
            
            currentProduct = product;
            const name = getProp(product, 'name');
            const ref = getProp(product, 'prod_reference');
            const imgName = getProp(product, 'main_image');
            const subType = getProp(product, 'sub_type') || getProp(product, 'type');
            const desc = getProp(product, 'description') || getProp(product, 'short_description');
            
            const mainImgUrl = imgName ? (imageBaseUrl + imgName) : 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&q=80&w=600';
            document.getElementById('mainImg').src = mainImgUrl;
            document.getElementById('productName').textContent = name;
            document.getElementById('categoryLabel').textContent = subType || 'Premium Gift';
            document.getElementById('skuLabel').textContent = 'REFERÊNCIA: ' + ref;
            document.getElementById('productDesc').textContent = desc || 'A M. Pietro seleciona apenas o que há de melhor para sua marca. Este item premium combina durabilidade com um design contemporâneo, perfeito para presentear seus clientes mais exigentes.';
            
            // Handle multiple images if present
            const allImages = getProp(product, 'allimagelist') || getProp(product, 'all_images');
            if (allImages) {
                const imgList = allImages.split(',').map(i => i.trim()).filter(i => i !== "");
                if (imgList.length > 1) {
                    const gallery = document.createElement('div');
                    gallery.className = "flex gap-4 mt-10 overflow-x-auto no-scrollbar";
                    imgList.forEach(imgFile => {
                        const thumbUrl = imageBaseUrl + imgFile;
                        const thumb = document.createElement('div');
                        thumb.className = "thumb-gallery w-24 h-24 rounded-[2rem] bg-white border border-zinc-100 p-4 cursor-pointer flex-shrink-0 flex items-center justify-center overflow-hidden";
                        thumb.innerHTML = `<img src="${thumbUrl}" class="w-full h-full object-contain mix-blend-multiply">`;
                        thumb.onclick = () => {
                            document.getElementById('mainImg').src = thumbUrl;
                            document.querySelectorAll('.thumb-gallery').forEach(t => t.classList.remove('active'));
                            thumb.classList.add('active');
                        };
                        gallery.appendChild(thumb);
                    });
                    document.getElementById('mainImg').parentElement.after(gallery);
                }
            }

            document.getElementById('productContainer').classList.remove('opacity-0');
            
            loadRelated(product.type || product.sub_type || getProp(product, 'type'));
            updateCartUI();
        }

        async function loadRelated(cat) {
            if (!cat) return;
            const data = await fetchApi('related', { cat });
            const grid = document.getElementById('relatedGrid');
            if(data && Array.isArray(data)) data.forEach(p => {
                const r_name = getProp(p, 'name');
                const r_ref = getProp(p, 'prod_reference');
                const r_img = getProp(p, 'main_image');
                
                const img = r_img ? (imageBaseUrl + r_img) : 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&q=80&w=400';
                const card = document.createElement('a');
                card.href = `produto.html?sku=${r_ref}`;
                card.className = "group block";
                card.innerHTML = `
                    <div class="relative aspect-square rounded-[40px] bg-zinc-50 overflow-hidden mb-6 border border-zinc-100 group-hover:shadow-xl transition-all duration-700 flex items-center justify-center">
                        <img src="${img}" class="w-full h-full object-contain transition-transform duration-700 group-hover:scale-110 mix-blend-multiply" loading="lazy">
                    </div>
                    <h4 class="font-bold text-sm text-zinc-900 group-hover:text-zinc-500 transition-colors uppercase line-clamp-1">${r_name}</h4>
                `;
                grid.appendChild(card);
            });
        }


        async function init() {
            if (!sku) { window.location.href = 'catalogo.html'; return; }
            
            const product = await fetchApi('product', { sku });
            if (!product) { window.location.href = 'catalogo.html'; return; }
            
            currentProduct = product;
            document.getElementById('mainImg').src = product.main_image ? (imageBaseUrl + product.main_image) : 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&q=80&w=600';
            document.getElementById('productName').textContent = product.name;
            document.getElementById('categoryLabel').textContent = product.sub_type || 'Premium Gift';
            document.getElementById('skuLabel').textContent = 'REFERÊNCIA: ' + product.prod_reference;
            document.getElementById('productDesc').textContent = product.description || product.short_description || 'Produto de alta qualidade com múltiplas opções de personalização.';
            
            // Handle multiple images if present
            if (product.all_images) {
                const imgList = product.all_images.split(',');
                if (imgList.length > 1) {
                    const gallery = document.createElement('div');
                    gallery.className = "flex gap-4 mt-8 overflow-x-auto no-scrollbar";
                    imgList.forEach(imgName => {
                        const thumb = document.createElement('div');
                        thumb.className = "w-20 h-20 rounded-2xl bg-zinc-50 border border-zinc-100 flex-shrink-0 cursor-pointer overflow-hidden p-2";
                        thumb.innerHTML = `<img src="${imageBaseUrl + imgName.trim()}" class="w-full h-full object-contain mix-blend-multiply">`;
                        thumb.onclick = () => document.getElementById('mainImg').src = imageBaseUrl + imgName.trim();
                        gallery.appendChild(thumb);
                    });
                    document.getElementById('mainImg').parentElement.after(gallery);
                }
            }

            // Handle customization options
            if (product.customization_options && product.customization_options.length > 0) {
                const methods = [...new Set(product.customization_options.map(o => o.CustomizationTypeName))];
                const custDiv = document.createElement('div');
                custDiv.className = "mt-12 pt-12 border-t border-zinc-100";
                custDiv.innerHTML = `
                    <h3 class="text-[11px] font-black uppercase tracking-[0.3em] text-zinc-400 mb-6">Técnicas de Personalização</h3>
                    <div class="flex flex-wrap gap-3">
                        ${methods.map(m => `<span class="px-4 py-2 bg-zinc-100 rounded-full text-[10px] font-black uppercase tracking-widest">${m}</span>`).join('')}
                    </div>
                `;
                document.getElementById('productDesc').after(custDiv);
            }

            document.getElementById('productContainer').classList.remove('opacity-0');
            
            loadRelated(product.type || product.sub_type);
            updateCartUI();
        }

        async function loadRelated(cat) {
            const data = await fetchApi('related', { cat });
            const grid = document.getElementById('relatedGrid');
            data.forEach(p => {
                const img = p.main_image ? (imageBaseUrl + p.main_image) : 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&q=80&w=400';
                const card = document.createElement('a');
                card.href = `produto.html?sku=${p.prod_reference}`;
                card.className = "group block";
                card.innerHTML = `
                    <div class="relative aspect-square rounded-[40px] bg-zinc-50 overflow-hidden mb-6 border border-zinc-100 group-hover:shadow-xl transition-all duration-700">
                        <img src="${img}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110 mix-blend-multiply" loading="lazy">
                    </div>
                    <h4 class="font-bold text-sm text-zinc-900 group-hover:text-zinc-500 transition-colors">${p.name}</h4>
                `;
                grid.appendChild(card);
            });
        }

        function updateQty(val) {
            const input = document.getElementById('qtyInput');
            input.value = Math.max(1, parseInt(input.value) + val);
        }

        document.getElementById('addBtn').onclick = () => {
            const qty = parseInt(document.getElementById('qtyInput').value);
            const index = cart.findIndex(item => item.id === currentProduct.prod_reference);
            if (index > -1) { cart[index].qty += qty; }
            else { cart.push({ id: currentProduct.prod_reference, name: currentProduct.name, qty: qty, img: currentProduct.main_image ? (imageBaseUrl + currentProduct.main_image) : '' }); }
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartUI();
            toggleCart();
        };

        function updateCartUI() {
            const badge = document.getElementById('cartCount');
            badge.textContent = cart.length;
            badge.classList.toggle('hidden', cart.length === 0);
            const container = document.getElementById('cartItems');
            container.innerHTML = cart.length === 0 ? '<div class="h-full flex items-center justify-center text-zinc-300 font-black uppercase tracking-widest">Vazio</div>' : '';
            cart.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = 'flex items-center gap-6';
                div.innerHTML = `<div class="w-24 h-24 bg-zinc-50 rounded-[24px] overflow-hidden flex-shrink-0"><img src="${item.img}" class="w-full h-full object-cover mix-blend-multiply"></div><div class="flex-1"><h4 class="text-sm font-black text-zinc-950 mb-1">${item.name}</h4><div class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest">${item.id} • ${item.qty} UN</div></div><button onclick="removeFromCart(${idx})" class="text-zinc-200 hover:text-red-500 transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>`;
                container.appendChild(div);
            });
        }
        function removeFromCart(idx) { cart.splice(idx, 1); localStorage.setItem('cart', JSON.stringify(cart)); updateCartUI(); }
        function toggleCart() { document.getElementById('cartSidebar').classList.toggle('translate-x-full'); }
        function sendToWhatsApp() {
            if (cart.length === 0) return;
            let text = "Olá! Gostaria de um orçamento para os seguintes itens premium:\n\n";
            cart.forEach(item => text += `• ${item.name}\n  REF: ${item.id} | Qtd: ${item.qty}\n\n`);
            window.open(`https://wa.me/5511987654321?text=${encodeURIComponent(text)}`);
        }

        init();
    </script>
</body>
</html>
