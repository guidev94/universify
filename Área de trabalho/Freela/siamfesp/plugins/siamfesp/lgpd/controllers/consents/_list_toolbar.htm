<div data-control="toolbar">
    <button
        type="button"
        class="btn btn-danger oc-icon-trash-o"
        disabled="disabled"
        onclick="var btn=this; oc.confirmPromise('Tem certeza que deseja excluir os consentimentos selecionados?').then(function(){ $(btn).request('onDelete', { data: { checked: $('.control-list').listWidget('getChecked') }, flash: true, success: function(data){ this.success(data); $('.control-list').listWidget('uncheckAll'); } }); }); return false;"
        data-trigger-action="enable"
        data-trigger=".control-list input[type=checkbox]"
        data-trigger-condition="checked"
        data-stripe-load-indicator>
        Excluir selecionados
    </button>
</div>
