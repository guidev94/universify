<div data-control="toolbar">
    <button
        type="button"
        class="btn btn-danger oc-icon-trash-o"
        disabled="disabled"
        onclick="var checked=$('.control-list').listWidget('getChecked'); if(!checked||!checked.length) return false; oc.vueComponentHelpers.modalUtils.showConfirm('Confirmação', 'Tem certeza que deseja excluir os consentimentos selecionados?', {buttonText:'Sim, excluir', isDanger:true}).then(function(){ $.request('onDelete', {data:{checked:checked}}); }); return false;"
        data-trigger-action="enable"
        data-trigger=".control-list input[type=checkbox]"
        data-trigger-condition="checked"
        data-stripe-load-indicator>
        Excluir selecionados
    </button>
</div>
