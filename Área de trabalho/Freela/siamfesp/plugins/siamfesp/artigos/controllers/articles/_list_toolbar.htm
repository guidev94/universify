<div data-control="toolbar">
    <a href="<?= Backend::url('siamfesp/artigos/articles/create') ?>" class="btn btn-primary oc-icon-plus">
        Novo Artigo
    </a>
    <a href="<?= Backend::url('siamfesp/artigos/articles/reorder') ?>" class="btn btn-default oc-icon-sort">
        Reordenar
    </a>

    <button
        type="button"
        class="btn btn-danger oc-icon-trash-o"
        disabled="disabled"
        onclick="var $btn=$(this), checked=$('.control-list').listWidget('getChecked'); if(!checked||!checked.length){return false;} oc.confirmPromise('Tem certeza que deseja excluir os itens selecionados?').then(function(){ $.request('onDelete', {data:{checked:checked}, flash:true, complete:function(){$('.control-list').listWidget('uncheckAll');}}); }); return false;"
        data-trigger-action="enable"
        data-trigger=".control-list input[type=checkbox]"
        data-trigger-condition="checked"
        data-stripe-load-indicator>
        Excluir selecionados
    </button>
</div>
