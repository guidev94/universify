<?= $this->listRender() ?>

<script>
/* SIAMFESP_LIST_ROW_EDIT_FIX_V4
 * Abre a edição com apenas 1 clique, inclusive depois de buscar/filtrar via AJAX.
 * Usa pointerdown/mousedown em captura para navegar antes do blur do campo de busca disparar outra atualização.
 * Não bloqueia checkbox, botões, links, switches ou controles da lista.
 */
(function () {
    var updateBaseUrl = '<?= Backend::url("siamfesp/artigos/articlecategories/update") ?>';
    var isNavigating = false;

    function closestElement(target, selector) {
        if (!target) {
            return null;
        }

        if (target.nodeType !== 1) {
            target = target.parentElement;
        }

        return target && target.closest ? target.closest(selector) : null;
    }

    function isInsideIgnoredControl(target) {
        return !!closestElement(target, [
            'a[href]',
            'button',
            'input',
            'select',
            'textarea',
            'label',
            '.control-checkbox',
            '.custom-checkbox',
            '.list-checkbox',
            '.checkbox',
            '.switch',
            '.list-cell-type-switch',
            '.list-cell-type-button',
            '.dropdown-menu',
            '.dropdown-toggle',
            '.list-setup',
            '.nolink',
            '[role="button"]'
        ].join(','));
    }

    function normalizeUrl(url) {
        if (!url) {
            return '';
        }

        url = String(url).trim();

        if (!url || url === '#' || url.indexOf('javascript:') === 0) {
            return '';
        }

        return url;
    }

    function extractIdFromText(text) {
        text = String(text || '').replace(/\s+/g, ' ').trim();
        return /^\d+$/.test(text) ? text : '';
    }

    function extractUpdateUrlFromText(text) {
        text = String(text || '');
        var match = text.match(/(?:https?:\/\/[^\s'"]+)?\/admin\/[^'"\s;]+\/update\/([^'"\s;]+)/i) ||
            text.match(/\/update\/([^'"\s;]+)/i);

        return match ? match[0] : '';
    }

    function extractIdFromDataText(text) {
        text = String(text || '');

        var patterns = [
            /(?:^|[,{;\s])id\s*[:=]\s*["']?(\d+)["']?/i,
            /(?:^|[,{;\s])record_id\s*[:=]\s*["']?(\d+)["']?/i,
            /(?:^|[,{;\s])recordId\s*[:=]\s*["']?(\d+)["']?/i,
            /(?:^|[,{;\s])checked\s*[:=]\s*["']?(\d+)["']?/i
        ];

        for (var i = 0; i < patterns.length; i++) {
            var match = text.match(patterns[i]);
            if (match && match[1]) {
                return match[1];
            }
        }

        return '';
    }

    function getRowId(row) {
        var attrs = [
            'data-record-id',
            'data-id',
            'data-list-record-id',
            'data-request-data',
            'data-record-data'
        ];

        for (var a = 0; a < attrs.length; a++) {
            var value = row.getAttribute(attrs[a]) || '';

            if (value && value !== 'on') {
                var plainId = extractIdFromText(value);
                if (plainId) {
                    return plainId;
                }

                var dataId = extractIdFromDataText(value);
                if (dataId) {
                    return dataId;
                }
            }
        }

        var checkbox = row.querySelector('input[name="checked[]"][value], input[type="checkbox"][value]');

        if (checkbox && checkbox.value && checkbox.value !== 'on') {
            return checkbox.value;
        }

        var idCell = row.querySelector('[data-list-cell-name="id"], td[data-column="id"], td[data-name="id"]');

        if (idCell) {
            var recordId = extractIdFromText(idCell.innerText || idCell.textContent);
            if (recordId) {
                return recordId;
            }
        }

        var cells = row.querySelectorAll('td');

        for (var i = 0; i < cells.length; i++) {
            var cellText = cells[i].innerText || cells[i].textContent;
            var idFromCell = extractIdFromText(cellText);
            if (idFromCell) {
                return idFromCell;
            }
        }

        return '';
    }

    function getRowEditUrl(row) {
        var directUrl = normalizeUrl(
            row.getAttribute('data-href') ||
            row.getAttribute('data-link') ||
            row.getAttribute('data-url') ||
            row.getAttribute('data-record-url')
        );

        if (directUrl) {
            return directUrl;
        }

        var onclickUrl = normalizeUrl(extractUpdateUrlFromText(row.getAttribute('onclick') || ''));

        if (onclickUrl) {
            return onclickUrl;
        }

        var link = row.querySelector('a[href*="/update/"]');

        if (link) {
            directUrl = normalizeUrl(link.getAttribute('href'));
            if (directUrl) {
                return directUrl;
            }
        }

        var recordId = getRowId(row);

        if (!recordId) {
            return '';
        }

        return updateBaseUrl.replace(/\/+$/, '') + '/' + encodeURIComponent(recordId);
    }

    function markRows() {
        var rows = document.querySelectorAll('.control-list tbody tr, .list-widget tbody tr, table.table tbody tr');

        for (var i = 0; i < rows.length; i++) {
            if (getRowEditUrl(rows[i])) {
                rows[i].classList.add('siamfesp-row-opens-edit');
                rows[i].style.cursor = 'pointer';
            }
        }
    }

    function navigate(url, event) {
        if (!url || isNavigating) {
            return;
        }

        isNavigating = true;

        if (event) {
            event.preventDefault();
            event.stopPropagation();

            if (event.stopImmediatePropagation) {
                event.stopImmediatePropagation();
            }
        }

        if (event && (event.ctrlKey || event.metaKey || event.button === 1)) {
            window.open(url, '_blank');
            isNavigating = false;
            return;
        }

        window.location.assign(url);
    }

    function handleRowOpen(event) {
        if (event.button && event.button !== 0 && event.button !== 1) {
            return;
        }

        if (isInsideIgnoredControl(event.target)) {
            return;
        }

        var row = closestElement(event.target, '.control-list tbody tr, .list-widget tbody tr, table.table tbody tr');

        if (!row) {
            return;
        }

        var url = getRowEditUrl(row);

        if (!url) {
            return;
        }

        navigate(url, event);
    }

    document.addEventListener('pointerdown', handleRowOpen, true);

    if (!window.PointerEvent) {
        document.addEventListener('mousedown', handleRowOpen, true);
    }

    document.addEventListener('click', handleRowOpen, true);
    document.addEventListener('DOMContentLoaded', markRows);

    if (window.jQuery) {
        jQuery(document).ajaxComplete(function () {
            window.setTimeout(markRows, 50);
            window.setTimeout(markRows, 180);
            window.setTimeout(markRows, 500);
        });

        jQuery(document).on('render ajaxUpdateComplete', function () {
            window.setTimeout(markRows, 50);
            window.setTimeout(markRows, 180);
        });
    }

    if (window.MutationObserver) {
        var observer = new MutationObserver(function () {
            window.clearTimeout(window.__siamfespRowEditMarkTimer);
            window.__siamfespRowEditMarkTimer = window.setTimeout(markRows, 80);
        });

        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    }

    window.setTimeout(markRows, 200);
    window.setTimeout(markRows, 700);
})();
</script>
