fields:
  title:
    label: Título
    type: text
    span: left
    required: true

  slug:
    label: Slug
    type: text
    span: right
    comment: Se ficar vazio, o sistema recria automaticamente pelo título.
    preset:
      field: title
      type: slug

  parent:
    label: Categoria pai
    type: relation
    nameFrom: title
    emptyOption: Sem categoria pai
    span: left

  description:
    label: Descrição
    type: textarea
    size: large
    span: full
