<div data-control="toolbar">
    <a href="<?= Backend::url('siamfesp/associados/associates/create') ?>" class="btn btn-primary oc-icon-plus">

    </a>
    <a href="<?= Backend::url('siamfesp/associados/associates/reorder') ?>" class="btn btn-default oc-icon-sort">

    <button
        type="button"
        class="btn btn-danger oc-icon-trash-o"
        disabled="disabled"

        data-trigger=".control-list input[type=checkbox]"
        data-trigger-condition="checked"
