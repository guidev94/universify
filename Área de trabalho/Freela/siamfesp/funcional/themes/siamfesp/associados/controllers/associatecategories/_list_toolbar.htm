<div data-control="toolbar">
    <a href="<?= Backend::url('siamfesp/associados/associatecategories/create') ?>" class="btn btn-primary oc-icon-plus">Nova Categoria</a>
    <a href="<?= Backend::url('siamfesp/associados/associatecategories/reorder') ?>" class="btn btn-default oc-icon-sort">Reordenar</a>
    <button
        class="btn btn-danger oc-icon-trash-o"
        disabled="disabled"
        type="button"
        onclick="
            var checked = $('.control-list').listWidget('getChecked');
            if (!checked || !checked.length) { return false; }
            if (!confirm('Tem certeza que deseja excluir os itens selecionados?')) { return false; }
            $(this).request('onDelete', { data: { checked: checked } });
            return false;
        "
        data-trigger-action="enable"
        data-trigger=".control-list input[type=checkbox]"
        data-trigger-condition="checked"
        data-stripe-load-indicator>
        Excluir selecionados
    </button>
</div>
