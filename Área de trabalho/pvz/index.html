                { id: 'starfruit', cost: 125, card: 'images/SunFlower.png', gif: 'images/SunFlower.gif', tint: 'hue-rotate(60deg)', name: 'Estrela' },
                { id: 'wintermelon', cost: 200, card: 'images/Peashooter.png', gif: 'images/Peashooter.gif', tint: 'hue-rotate(200deg)', name: 'Winter' },
                { id: 'hypnoshroom', cost: 75, card: 'images/SunFlower.png', gif: 'images/SunFlower.gif', tint: 'hue-rotate(300deg)', name: 'Hipno' },
                { id: 'gravebuster', cost: 75, card: 'images/TallNut.png', gif: 'images/TallNut.gif', tint: 'brightness(0.3)', name: 'Comedor' },
                { id: 'marigold', cost: 50, card: 'images/SunFlower.png', gif: 'images/SunFlower.gif', tint: 'hue-rotate(200deg)', name: 'Gold' },

                { id: 'tanglekelp', cost: 25, card: 'images/SunFlower.png', gif: 'images/SunFlower.gif', tint: 'hue-rotate(180deg) brightness(0.3)', name: 'Alga', isWater: true },
                { id: 'flowerpot', cost: 25, card: 'images/SunFlower.png', gif: 'images/SunFlower.gif', tint: 'sepia(0.8) brightness(0.8)', name: 'Vaso', isRoof: true },
                { id: 'cabbagepult', cost: 100, card: 'images/Peashooter.png', gif: 'images/Peashooter.gif', tint: 'hue-rotate(80deg)', name: 'Repolho', isPult: true },
                { id: 'cornpult', cost: 100, card: 'images/SunFlower.png', gif: 'images/SunFlower.gif', tint: 'hue-rotate(40deg)', name: 'Milho', isPult: true },
                { id: 'melonpult', cost: 300, card: 'images/Peashooter.png', gif: 'images/Peashooter.gif', tint: 'hue-rotate(150deg)', name: 'Melancia', isPult: true }
            ],

                { id: 'normal', hp: 80, img: 'Zombie.gif', eat: 'ZombieAttack.gif', name: 'COMUM', speed: 0.4 },
                { id: 'cone', hp: 200, img: 'ConeheadZombie.gif', eat: 'ConeheadZombieAttack.gif', name: 'CONE', speed: 0.4 },
                { id: 'bucket', hp: 500, img: 'BucketheadZombie.gif', eat: 'BucketheadZombieAttack.gif', name: 'BALDE', speed: 0.4 },
                { id: 'football', hp: 800, img: 'Zombie.gif', eat: 'ZombieAttack.gif', name: 'ATLETA', speed: 1.0, tint: 'hue-rotate(-50deg)' },
                { id: 'door', hp: 1000, img: 'Zombie.gif', eat: 'ZombieAttack.gif', name: 'PORTA', speed: 0.3, tint: 'contrast(0.5)' },
                { id: 'balloon', hp: 150, img: 'Zombie.gif', eat: 'ZombieAttack.gif', name: 'BALÃO', speed: 0.8, tint: 'hue-rotate(90deg)', type: 'air' },
                { id: 'gargantuar', hp: 3000, img: 'Zombie.gif', eat: 'ZombieAttack.gif', name: 'BOSS', speed: 0.2, scale: 1.4, tint: 'contrast(1.5)' },
                { id: 'zomboni', hp: 1200, img: 'Zombie.gif', eat: 'ZombieAttack.gif', name: 'ZOMBONI', speed: 0.7, tint: 'hue-rotate(180deg)' },
                { id: 'dolphin', hp: 300, img: 'Zombie.gif', eat: 'ZombieAttack.gif', name: 'GOLFINHO', speed: 1.1, isAir: true, tint: 'hue-rotate(200deg)' },
                { id: 'pogo', hp: 300, img: 'Zombie.gif', eat: 'ZombieAttack.gif', name: 'POGO', speed: 0.6, canVault: true },
                { id: 'newspaper', hp: 400, img: 'Zombie.gif', eat: 'ZombieAttack.gif', name: 'JORNAL', speed: 0.5, tint: 'grayscale(0.8)' },
                { id: 'snorkel', hp: 250, img: 'Zombie.gif', eat: 'ZombieAttack.gif', name: 'SNORKEL', speed: 0.6, isWater: true, tint: 'hue-rotate(220deg)' },
                { id: 'tankmaster', hp: 2000, img: 'Zombie.gif', eat: 'ZombieAttack.gif', name: 'TANK MASTER', speed: 0.2, tint: 'brightness(0.5) contrast(2)', isTank: true },
                { id: 'zumboniking', hp: 5000, img: 'BucketheadZombie.gif', eat: 'BucketheadZombieAttack.gif', name: 'ZUMBONI KING', speed: 0.5, tint: 'hue-rotate(180deg) brightness(1.5)', scale: 1.8, isBoss: true }
            ],
            fusions: {
                'sunflower+peashooter': 'sunpea', 'peashooter+sunflower': 'sunpea',
                'wallnut+peashooter': 'nutpea', 'peashooter+wallnut': 'nutpea',
                'snowpea+wallnut': 'icenut', 'wallnut+snowpea': 'icenut',
                'repeater+sunflower': 'megasun', 'sunflower+repeater': 'megasun',
                'gatlingpea+wallnut': 'gatlingnut', 'wallnut+gatlingpea': 'gatlingnut',
                'twinsunflower+gatlingpea': 'sungatling', 'gatlingpea+twinsunflower': 'sungatling',
                'cherrybomb+jalapeno': 'nuclearbomb', 'jalapeno+cherrybomb': 'nuclearbomb',
                'tallnut+tallnut': 'titannut', 'gatlingpea+gatlingpea': 'hypergatling',
                'cherrybomb+peashooter': 'explodopea', 'repeater+jalapeno': 'plasmagatling',
                'snowpea+repeater': 'icerepeater', 'sunflower+torchwood': 'fireflower',
                'lilypad+sunflower': 'sunpad', 'tanglekelp+peashooter': 'kelppea'
            },
            grid: { sx: 255, sy: 160, cw: 82, ch: 110 }
        };

        const FUSION_DATA = {
            'sunpea': { gif: 'images/SunFlower.gif', hp: 600, projectile: 'pea', sunRate: 150, desc: 'Atira ervilhas e gera sol.' },
            'nutpea': { gif: 'images/TallNut.gif', hp: 4000, projectile: 'pea', desc: 'Barreira pesada que atira.' },
            'icenut': { gif: 'images/TallNut.gif', hp: 4000, projectile: 'snow', tint: 'hue-rotate(180deg)', desc: 'Barreira que congela inimigos.' },
            'megasun': { gif: 'images/TwinSunflower.gif', hp: 800, projectile: 'pea', sunRate: 80, count: 2, desc: 'Dobro de sol e dobro de tiro.' },
            'gatlingnut': { gif: 'images/TallNut.gif', hp: 6000, projectile: 'pea', count: 4, tint: 'sepia(0.3)', desc: 'Tanque com metralhadora.' },
            'sungatling': { gif: 'images/TwinSunflower.gif', hp: 1000, projectile: 'pea', sunRate: 60, count: 4, tint: 'hue-rotate(60deg)', desc: 'Suprema geração de recursos.' },
            'nuclearbomb': { gif: 'images/CherryBomb.gif', hp: 100, tint: 'hue-rotate(100deg)', onDeath: 'nuke', desc: 'Destruição total do mapa.' },
            'titannut': { gif: 'images/TallNut.gif', hp: 10000, tint: 'contrast(1.5)', scale: 1.1, desc: 'A maior vida do jogo.' },
            'hypergatling': { gif: 'images/GatlingPea.gif', hp: 2000, projectile: 'pea', count: 8, tint: 'hue-rotate(45deg)', desc: '8 disparos simultâneos.' },
            'explodopea': { gif: 'images/Peashooter.gif', hp: 800, projectile: 'pea', onDeath: 'explode', tint: 'contrast(2)', desc: 'Ervilha explosiva.' },
            'plasmagatling': { gif: 'images/GatlingPea.gif', hp: 2500, projectile: 'pea', count: 5, tint: 'hue-rotate(200deg) brightness(2)', desc: 'Dano de plasma azul.' },
            'icerepeater': { gif: 'images/SnowPea.gif', hp: 800, projectile: 'snow', count: 2, tint: 'brightness(1.5)', desc: 'Repetidora de gelo.' },
            'fireflower': { gif: 'images/SunFlower.gif', hp: 1000, sunRate: 40, tint: 'hue-rotate(-30deg) brightness(1.8)', desc: 'Sol de fogo ultra rápido.' },
            'sunpad': { gif: 'images/SunFlower.gif', hp: 400, isWater: true, sunRate: 50, tint: 'hue-rotate(120deg)', desc: 'Gera sol sobre a água.' },
            'kelppea': { gif: 'images/Peashooter.gif', hp: 500, isWater: true, projectile: 'pea', tint: 'hue-rotate(180deg)', desc: 'Ataque subaquático.' },
            'tankmaster': { gif: 'images/Zombie.gif', hp: 3000, speed: 0.2, tint: 'brightness(0.5) contrast(2)', desc: 'Carrega zumbis nas costas.' }
        };

        function getCellPos(gx, gy) {
            let x = MOD_CONFIG.grid.sx + gx * MOD_CONFIG.grid.cw;
            let y = MOD_CONFIG.grid.sy + gy * MOD_CONFIG.grid.ch;
            if (state.world === 'roof') {
                if (gx < 5) y -= (5 - gx) * 20;
            }
            return { x, y };
        }

        let state = { sun: 200, level: 1, name: '', plants: [], zombies: [], bullets: [], lawnmowers: [], coins: 0, chosen: [], selectedZombies: [], selected: null, isShovel: false, isPlantFood: false, plantFood: 3, running: false, scale: 1, tick: 0, gameSpeed: 1, wave: 0, world: 'day', modStyle: 'standard', gravestones: [], bgBrightness: 1, loopStarted: false, discoveredFusions: [], mode: 'adventure', vases: [] };
        const view = document.getElementById('game-view'), layer = document.getElementById('game-layer'), ghost = document.getElementById('mouse-ghost'), highlight = document.getElementById('grid-highlight');

        function playSnd(id) { const el = document.getElementById(id); if (el) { el.currentTime = 0; el.play().catch(()=>{}); } }
        function updateUI() { 
            document.getElementById('sun-val').innerText = state.sun; 
            document.getElementById('coin-val').innerText = state.coins; 
            document.getElementById('level-display').innerText = `NÍVEL: ${state.level}`; 
            document.getElementById('food-val').innerText = state.plantFood;
            const wv = document.getElementById('wave-val'); if(wv) wv.innerText = state.wave; 
        }
        function showScreen(id) { document.querySelectorAll('.overlay').forEach(s => s.style.display = 'none'); document.getElementById(id).style.display = 'flex'; }
        function confirmName() { state.name = document.getElementById('name-input').value || 'Guerreiro'; localStorage.setItem('pvz_fusion_save', JSON.stringify({ name: state.name, level: state.level, coins: state.coins, discovered: state.discoveredFusions })); showMenu(); }
        function showMenu() { showScreen('menu-screen'); document.getElementById('user-display').innerText = `DEFENSOR: ${state.name}`; }
        function openStageSelector() {
            showScreen('stage-screen');
            const grid = document.getElementById('stage-grid'); grid.innerHTML = '';
            for(let i=1; i<=10; i++) {
                const btn = document.createElement('button'); btn.className = 'btn-game'; btn.innerText = i; btn.style.fontSize = '14px';
                btn.onclick = () => selectStage(i);
                grid.appendChild(btn);
            }
        }
        function selectStage(lvl) {
            if (lvl === 'custom_chaos') { state.level = 10; state.modStyle = 'japanese'; MOD_CONFIG.zombies.forEach(z => z.speed *= 1.5); }
            else if (lvl === 'custom_boss') { state.level = 20; state.selectedZombies = ['gargantuar', 'tankmaster']; }
            else { state.level = lvl; state.modStyle = 'standard'; }
            openChooser();
        }
        function openShop() { showScreen('shop-screen'); }
        function buyItem(id, cost) { if (state.coins >= cost) { state.coins -= cost; updateUI(); alert('Comprado!'); } else alert('Sem moedas!'); }
        function toggleWorld() { 
            const modes = ['day', 'night', 'pool', 'roof'];
            let idx = modes.indexOf(state.world);
            state.world = modes[(idx + 1) % modes.length];
            const btn = document.getElementById('world-btn'), bg = document.getElementById('bg-layer');
            btn.innerText = `MUNDO: ${state.world.toUpperCase()}`;
            if(state.world === 'night') bg.style.filter = 'brightness(0.4) hue-rotate(240deg)';
            else if(state.world === 'pool') bg.style.filter = 'hue-rotate(180deg) brightness(0.8) contrast(1.2)';
            else if(state.world === 'roof') bg.style.filter = 'hue-rotate(30deg) brightness(0.7) contrast(1.5)';
            else bg.style.filter = 'none';
        }
        function toggleModStyle() {
            state.modStyle = (state.modStyle === 'standard' ? 'japanese' : 'standard');
            const btn = document.getElementById('mod-btn');
            btn.innerText = `MOD: ${state.modStyle.toUpperCase()}`;
            if (state.modStyle === 'japanese') { MOD_CONFIG.zombies.forEach(z => z.speed *= 1.5); FUSION_DATA.hypergatling.count = 12; }
            else { MOD_CONFIG.zombies.forEach(z => z.speed /= 1.5); FUSION_DATA.hypergatling.count = 8; }
        }
        function addBookmark() { alert("Pressione CTRL + D para adicionar aos seus favoritos!"); }

        function openAlmanac() {
            showScreen('almanac-screen');
            const grid = document.getElementById('almanac-grid'); grid.innerHTML = '';
            Object.keys(FUSION_DATA).forEach(key => {
                const isDiscovered = state.discoveredFusions.includes(key);
                const data = FUSION_DATA[key];
                const div = document.createElement('div'); div.className = 'almanac-card';
                div.style.width = '150px'; div.style.height = '180px';
                div.innerHTML = `
                    <div style="filter: ${isDiscovered ? 'none' : 'brightness(0) invert(1)'}">
                        <img src="${data.gif}" style="width:60px; ${data.tint ? 'filter:'+data.tint : ''}">
                    </div>
                    <p style="color:${isDiscovered ? 'gold' : '#555'}; font-size:12px; font-family:'Bungee'; margin-top:10px;">${isDiscovered ? key.toUpperCase() : '???'}</p>
                    ${isDiscovered ? `
                        <p style="color:#fff; font-size:10px; margin-top:5px;">${data.desc}</p>
                        <div style="display:flex; justify-content:space-around; margin-top:10px; font-size:9px; color:var(--accent);">
                            <span>HP: ${data.hp}</span>
                            <span>${data.sunRate ? 'SOL: '+data.sunRate : ''}</span>
                        </div>
                    ` : ''}
                `;
                grid.appendChild(div);
            });
        }

        function resize() { const sw = window.innerWidth, sh = window.innerHeight, gw = 1400, gh = 750; state.scale = Math.min(sw/gw, sh/gh); view.style.transform = `scale(${state.scale})`; view.style.left = (sw - gw * state.scale) / 2 + 'px'; view.style.top = (sh - gh * state.scale) / 2 + 'px'; }
        window.onload = () => { 
            window.addEventListener('resize', resize); resize(); 
            const fill = document.getElementById('load-fill');
            gsap.to(fill, { width: '100%', duration: 1, onComplete: () => { 
                const saved = localStorage.getItem('pvz_fusion_save'); 
                if(saved) { const d = JSON.parse(saved); state.name = d.name; state.level = d.level; state.coins = d.coins || 0; state.discoveredFusions = d.discovered || []; showMenu(); } 
                else showScreen('name-screen'); 
                document.getElementById('loading-screen').style.display = 'none'; 
            }}); 
        };

        function openChooser() {
            showScreen('chooser-screen'); state.chosen = []; state.selectedZombies = []; updateChooserUI();
            const zp = document.getElementById('zombie-preview'); zp.innerHTML = '';
            MOD_CONFIG.zombies.forEach(z => {
                const div = document.createElement('div'); div.className = 'zombie-card';
                div.innerHTML = `<img src="images/${z.img}" style="${z.tint?'filter:'+z.tint:''}"><p>${z.name}</p>`;
                div.onclick = () => { if(state.selectedZombies.includes(z.id)) { state.selectedZombies = state.selectedZombies.filter(id=>id!==z.id); div.classList.remove('selected'); } else { state.selectedZombies.push(z.id); div.classList.add('selected'); }};
                zp.appendChild(div);
            });
            const grid = document.getElementById('chooser-grid'); grid.innerHTML = '';
            MOD_CONFIG.plants.forEach(p => {
                const div = document.createElement('div'); div.className = 'chooser-seed';
                div.innerHTML = `<img src="${p.card}" style="${p.tint?'filter:'+p.tint:''}"><div class="cost-tag">${p.cost}</div>`;
                div.onclick = () => { if(state.chosen.length < 14 && !state.chosen.includes(p)) { state.chosen.push(p); div.classList.add('chosen'); updateChooserUI(); playSnd('snd-plant'); }};
                grid.appendChild(div);
            });
        }
        function updateChooserUI() { document.getElementById('chooser-count').innerText = `(${state.chosen.length}/14)`; document.getElementById('btn-fight').style.display = (state.chosen.length > 0 ? 'block' : 'none'); }

        function startCombat() {
            showScreen('hud'); document.getElementById('hud').style.display = 'flex';
            state.mode = (state.mode === 'unlimited' ? 'unlimited' : 'adventure');
            initLevel(); state.running = true; playSnd('snd-ready'); const bgm = document.getElementById(state.world==='night'?'bgm-night':'bgm-day'); if(bgm) { bgm.volume = 0.3; bgm.play().catch(()=>{}); } if(!state.loopStarted) { state.loopStarted = true; setInterval(gameLoop, 20); }
        }

        function startUnlimited() { state.mode = 'unlimited'; state.sun = 9999; startCombat(); }

        function initLevel() {
            layer.innerHTML = ''; state.plants = []; state.zombies = []; state.bullets = []; state.lawnmowers = []; state.gravestones = []; state.wave = 0; updateUI();
            const tray = document.getElementById('seed-tray'); tray.innerHTML = '';
            state.chosen.forEach(p => {
                const div = document.createElement('div'); div.className = 'seed-card';
                div.innerHTML = `<img src="${p.card}" style="${p.tint?'filter:'+p.tint:''}"><div class="cost">${p.cost}</div>`;
                div.onclick = (e) => { e.stopPropagation(); pickSeed(p, div); };
                tray.appendChild(div);
            });
            for(let i=0; i<5; i++) {
                const el = document.createElement('img'); el.src = 'images/LawnMower.gif'; el.className = 'entity lawnmower'; el.style.left = '150px'; el.style.top = (MOD_CONFIG.grid.sy + i*MOD_CONFIG.grid.ch + 10) + 'px';
                layer.appendChild(el); state.lawnmowers.push({ el, row: i, x: 150, active: false });
            }
            if(state.world === 'night') for(let i=0; i<6; i++) { const gx = 5+Math.floor(Math.random()*4), gy = Math.floor(Math.random()*5); const el = document.createElement('div'); el.className = 'gravestone'; el.style.left = (MOD_CONFIG.grid.sx+gx*MOD_CONFIG.grid.cw)+'px'; el.style.top = (MOD_CONFIG.grid.sy+gy*MOD_CONFIG.grid.ch)+'px'; layer.appendChild(el); state.gravestones.push({ el, gx, gy }); }
        }

        function toggleShovel() { if(state.isShovel) cancelPick(); else { cancelPick(); state.isShovel = true; document.getElementById('shovel-btn').classList.add('active'); setupInput(); } }
        function togglePlantFood() { if(state.plantFood > 0) { if(state.isPlantFood) cancelPick(); else { cancelPick(); state.isPlantFood = true; document.getElementById('food-btn').style.background = 'rgba(76, 175, 80, 0.8)'; setupInput(); } } }
        function pickSeed(p, el) { 
            if (state.sun < p.cost && state.mode !== 'unlimited') { cancelPick(); return; }
            cancelPick(); state.selected = p; el.classList.add('active'); ghost.src = p.gif; ghost.style.display = 'block'; if(p.tint) ghost.style.filter = p.tint; setupInput(); 
        }
        function cancelPick() { state.selected = null; state.isShovel = false; state.isPlantFood = false; ghost.style.display = 'none'; highlight.style.display = 'none'; document.querySelectorAll('.seed-card').forEach(s=>s.classList.remove('active')); document.getElementById('shovel-btn').classList.remove('active'); document.getElementById('food-btn').style.background = 'rgba(76, 175, 80, 0.3)'; document.onmousemove = null; view.onmousedown = null; }

        function setupInput() {
            document.onmousemove = (e) => {
                const r = view.getBoundingClientRect(), lx = (e.clientX - r.left)/state.scale, ly = (e.clientY - r.top)/state.scale;
                ghost.style.left = lx+'px'; ghost.style.top = ly+'px';
                const gx = Math.floor((lx-MOD_CONFIG.grid.sx)/MOD_CONFIG.grid.cw), gy = Math.floor((ly-MOD_CONFIG.grid.sy)/MOD_CONFIG.grid.ch);
                if(gx>=0 && gx<9 && gy>=0 && gy<5) {
                    const pos = getCellPos(gx, gy);
                    highlight.style.display = 'block'; highlight.style.left = pos.x+'px'; highlight.style.top = pos.y+'px';
                    const exist = state.plants.find(p=>p.gx===gx && p.gy===gy);
                    if(state.isShovel) highlight.style.borderColor = exist?'#fff':'#f00';
                    else if(state.selected) highlight.style.borderColor = exist?(MOD_CONFIG.fusions[`${exist.id}+${state.selected.id}`]?'gold':'#f00'):(state.sun >= state.selected.cost || state.mode === 'unlimited' ? '#0f0' : '#f00');
                } else highlight.style.display = 'none';
            };
            view.onmousedown = (e) => { const r = view.getBoundingClientRect(), lx = (e.clientX - r.left)/state.scale, ly = (e.clientY - r.top)/state.scale, gx = Math.floor((lx-MOD_CONFIG.grid.sx)/MOD_CONFIG.grid.cw), gy = Math.floor((ly-MOD_CONFIG.grid.sy)/MOD_CONFIG.grid.ch); if(gx>=0 && gx<9 && gy>=0 && gy<5) { if(handleAction(gx, gy)) cancelPick(); } else cancelPick(); };
        }

        function handleAction(gx, gy) {
            const plantsAtCell = state.plants.filter(p=>p.gx===gx && p.gy===gy);
            const exist = plantsAtCell.find(p => p.id !== 'flowerpot') || plantsAtCell[0];
            const pot = plantsAtCell.find(p => p.id === 'flowerpot');

            if(state.isShovel) { 
                if(exist) { 
                    exist.el.remove(); 
                    state.plants = state.plants.filter(p => p !== exist);
                    playSnd('snd-plant'); return true; 
                } 
                return false; 
            }
            if(state.isPlantFood) {
                if(exist) {
                    state.plantFood--; updateUI();
                    triggerPlantFood(exist);
                    return true;
                }
                return false;
            }
            if(!state.selected) return false;
            if(state.mode !== 'unlimited' && state.sun < state.selected.cost) { cancelPick(); return false; }
            
            if(state.world === 'roof') {
                if(state.selected.id === 'flowerpot') {
                    if(pot) return false;
                    if (state.mode!=='unlimited') state.sun -= state.selected.cost;
                    updateUI(); spawnPlant('flowerpot', gx, gy); return true;
                }
                if(!pot) {
                    alert("Você precisa de um VASO!");
                    cancelPick(); return false;
                }
            }

            if(exist && exist.id !== 'flowerpot') {
                const fId = MOD_CONFIG.fusions[`${exist.id}+${state.selected.id}`];
                if(fId) { 
                    if(state.mode!=='unlimited') state.sun -= state.selected.cost; 
                    updateUI(); exist.el.remove(); 
                    state.plants = state.plants.filter(p => p !== exist);
                    spawnPlant(fId, gx, gy, true); 
                    if(!state.discoveredFusions.includes(fId)) { 
                        state.discoveredFusions.push(fId); showAchievement(fId); confirmName(); 
                    } 
                    return true; 
                }
                return false;
            }
            if (state.mode!=='unlimited') state.sun -= state.selected.cost; 
            updateUI(); spawnPlant(state.selected.id, gx, gy); return true;
        }

        function triggerPlantFood(p) {
            gsap.to(p.el, {filter:'brightness(3) contrast(1.5)', duration:0.2, repeat:5, yoyo:true, onComplete:()=>p.el.style.filter=(FUSION_DATA[p.id]?.tint || MOD_CONFIG.plants.find(i=>i.id===p.id)?.tint || '')});
            if(p.id.includes('pea')) {
                let count = 0;
                const interval = setInterval(() => {
                    shoot(p); count++;
                    if(count > 60) clearInterval(interval);
                }, 50);
            } else if(p.id.includes('sun')) {
                for(let i=0; i<15; i++) setTimeout(() => spawnSun(p), i*100);
            } else if(p.id.includes('nut')) {
                p.hp = 20000; p.el.style.filter = 'brightness(1.5) contrast(1.2)';
            } else {
                // Default: just heal and some particles
                p.hp += 2000; spawnParticle(getCellPos(p.gx, p.gy).x, getCellPos(p.gx, p.gy).y, 'spark');
            }
        }

        function showAchievement(id) { const t = document.getElementById('achievement-toast'), n = document.getElementById('achievement-name'); n.innerText = id.toUpperCase(); t.style.display = 'flex'; playSnd('snd-achievement'); gsap.fromTo(t, {x:400, opacity:0}, {x:0, opacity:1, duration:0.6}); setTimeout(()=>gsap.to(t, {x:400, opacity:0, onComplete:()=>t.style.display='none'}), 4000); }

        function spawnPlant(id, gx, gy, isHybrid=false) {
            const d = FUSION_DATA[id] || MOD_CONFIG.plants.find(p=>p.id===id);
            const pos = getCellPos(gx, gy);
            const el = document.createElement('img'); el.src = d.gif; el.className = 'entity plant ' + (isHybrid?'hybrid':'');
            el.style.left = pos.x+'px'; el.style.top = pos.y+'px'; el.style.zIndex = 400+gy;
            if(d.tint) el.style.filter = d.tint; if(d.scale) el.style.transform = `scale(${d.scale})`;
            layer.appendChild(el); playSnd('snd-plant');
            if(id==='cherrybomb' || id==='nuclearbomb') gsap.to(el, {scale:1.2, duration:0.8, repeat:1, yoyo:true, onComplete:()=>explode(gx, gy, el, id==='nuclearbomb'?3:1)});
            else if(id==='jalapeno') gsap.to(el, {scaleY:1.3, duration:0.8, onComplete:()=>burnRow(gy, el)});
            else { gsap.from(el, {scale:0, duration:0.5}); gsap.to(el, {x:"+=3", duration:2+Math.random(), repeat:-1, yoyo:true, ease:"sine.inOut"}); }
            state.plants.push({ id, gx, gy, el, hp: d.hp || (id.includes('nut')?4000:300), timer:0, projectile: d.projectile || (id.includes('pea')?(id.includes('snow')?'snow':'pea'):null), sunRate: d.sunRate || (id.includes('sun')?150:null), count: d.count || (id.includes('repeater')?2:1), onDeath: d.onDeath });
        }

        function explode(gx, gy, el, range=1) { el.src = 'images/Boom.gif'; el.style.width = (200*range)+'px'; el.style.height = (200*range)+'px'; el.style.transform = 'translate(-35%, -35%)'; state.zombies.forEach(z => { if(Math.abs(z.row-gy)<=range && Math.abs((MOD_CONFIG.grid.sx+gx*MOD_CONFIG.grid.cw)-z.x) < 150*range) z.hp = 0; }); setTimeout(()=>el.remove(), 1000); if(range>2) { gsap.to(view, {x:20, y:20, duration:0.1, repeat:10, yoyo:true}); showWaveMsg("APOCALYPSE!"); } }
        function burnRow(row, el) { el.src = 'images/JalapenoAttack.gif'; el.style.width = '1200px'; el.style.left = '200px'; state.zombies.forEach(z => { if(z.row===row) z.hp = 0; }); setTimeout(()=>el.remove(), 1000); }

        function spawnParticle(x, y, type) {
            const count = 5;
            for(let i=0; i<count; i++) {
                const p = document.createElement('div'); p.className = `particle ${type}`;
                const size = 5 + Math.random() * 10; p.style.width = size + 'px'; p.style.height = size + 'px'; p.style.left = x + 'px'; p.style.top = y + 'px';
                layer.appendChild(p); gsap.to(p, { x: x + (Math.random()-0.5) * 100, y: y + (Math.random()-0.5) * 100, opacity: 0, scale: 0, duration: 0.5 + Math.random(), onComplete: () => p.remove() });
            }
        }

        function gameLoop() {
            if(!state.running) return;
            const s = state.gameSpeed; state.tick += s; updateUI();
            const bg = document.getElementById('bg-layer');
            if(state.world==='day') { let br = Math.max(0.4, 1-state.wave*0.02); state.bgBrightness += (br-state.bgBrightness)*0.01; bg.style.filter = `brightness(${state.bgBrightness})`; }
            if(state.tick % (state.world==='day'?400:800) < s && state.mode !== 'unlimited') spawnSun();

            let spawnRate = Math.max(40, 250 - state.wave*10 - state.level*20);
            if(state.tick % spawnRate < s) {
                let pool = MOD_CONFIG.zombies.filter(z => state.selectedZombies.includes(z.id));
                if(pool.length === 0) pool = MOD_CONFIG.zombies.slice(0, Math.min(MOD_CONFIG.zombies.length, state.level + 2));
                const zD = pool[Math.floor(Math.random()*pool.length)], row = Math.floor(Math.random()*5), el = document.createElement('img'); el.src = `images/${zD.img}`; el.className = 'entity zombie';
                el.style.left = '1350px'; el.style.top = (MOD_CONFIG.grid.sy+row*MOD_CONFIG.grid.ch - 80)+'px'; if(zD.tint) el.style.filter = zD.tint; if(zD.scale) el.style.transform = `scale(${zD.scale})`;
                layer.appendChild(el);
                state.zombies.push({ el, x: 1350, row, hp: zD.hp, type: zD.id, state: 'walk', speed: zD.speed*s, isAir: zD.type==='air', canVault: zD.canVault, isTank: zD.isTank });
                if(state.tick % 800 < s) { state.wave++; if(state.wave%10===0) { showWaveMsg("HORDA!"); if(state.world==='night') state.gravestones.forEach(g=>setTimeout(()=>spawnZombieAt(g.gx, g.gy), Math.random()*2000)); } }
            }

            if(state.wave >= 20+state.level*10 && state.mode !== 'unlimited') winLevel();
            state.lawnmowers.forEach(m => { if(m.active) { m.x += 12*s; m.el.style.left = m.x+'px'; state.zombies.forEach(z=>{ if(z.row===m.row && Math.abs(z.x-m.x)<60) z.hp=0; }); if(m.x > 1400) { m.el.remove(); state.lawnmowers = state.lawnmowers.filter(i=>i!==m); } } else if(state.zombies.some(z=>z.row===m.row && z.x < 330)) m.active = true; });
            
            state.zombies.forEach(z => {
                const zD = MOD_CONFIG.zombies.find(i=>i.id===z.type);
                const t = z.isAir ? null : state.plants.find(p=>p.gy===z.row && Math.abs((getCellPos(p.gx, p.gy).x)-z.x) < 45);
                if(t) {
                    if (zD && zD.isBoss) { // Zumboni King crushes plants
                        t.hp -= 100*s; if(state.tick%30<s) playSnd('snd-chomp');
                    } else if(z.canVault) { 
                        z.canVault = false; playSnd('snd-plant'); gsap.to(z.el, {y:z.el.offsetTop-60, x:z.x-120, duration:0.6, onComplete:()=>z.x-=120}); 
                    } else {
                        t.hp -= 0.5*s; if(state.tick%60<s) playSnd('snd-chomp');
                    }
                    if((t.id.includes('nut') || t.id.includes('wall')) && t.hp < 1300) t.el.src = t.hp < 650 ? 'images/TallnutCracked2.gif' : 'images/TallnutCracked1.gif';
                    if(z.state!=='eat' && !zD.isBoss) { z.state='eat'; z.el.src=`images/${zD.eat}`; }
                    if(t.hp<=0) { if(t.onDeath==='explode') explode(t.gx, t.gy, t.el); t.el.remove(); state.plants = state.plants.filter(p=>p!==t); z.state='walk'; z.el.src=`images/${zD.img}`; }
                } else { 
                    if(z.state==='eat') { z.state='walk'; z.el.src=`images/${zD.img}`; } 
                    z.x -= z.speed; z.el.style.left = z.x+'px'; 
                    if (state.world === 'roof') {
                        let gx = (z.x - MOD_CONFIG.grid.sx) / MOD_CONFIG.grid.cw;
                        let y = MOD_CONFIG.grid.sy + z.row * MOD_CONFIG.grid.ch - 80;
                        if (gx < 5) y -= (5 - gx) * 20;
                        z.el.style.top = y + 'px';
                    }
                }
                if(z.type === 'zumboniking' && state.tick % 20 < s) {
                    // Leave ice trail
                    const ice = document.createElement('div');
                    ice.style.position = 'absolute'; ice.style.width = '60px'; ice.style.height = '40px';
                    ice.style.background = 'rgba(100, 200, 255, 0.4)'; ice.style.filter = 'blur(10px)';
                    ice.style.left = (z.x + 80) + 'px'; ice.style.top = (z.el.offsetTop + 100) + 'px';
                    ice.style.zIndex = 100; layer.appendChild(ice);
                    setTimeout(() => ice.remove(), 5000);
                }
                if(z.x < 280) { state.running=false; playSnd('snd-lose'); document.getElementById('game-over').style.display='flex'; }
                if(z.hp <= 0) { if(z.isTank) { z.isTank = false; spawnZombieAt(Math.floor((z.x-MOD_CONFIG.grid.sx)/MOD_CONFIG.grid.cw), z.row); } if(Math.random()>0.9) spawnCoin(z.x, MOD_CONFIG.grid.sy+z.row*MOD_CONFIG.grid.ch); z.el.src='images/ZombieDie.gif'; setTimeout(()=>{ try{z.el.remove();}catch(e){} state.zombies = state.zombies.filter(i=>i!==z); }, 1500/s); }
            });

            state.plants.forEach(p => {
                p.timer += s; if(p.sunRate && p.timer >= p.sunRate) { spawnSun(p); p.timer = 0; }
                if(p.projectile && p.timer >= 120) { shoot(p); if(p.count>1) for(let i=1; i<p.count; i++) setTimeout(()=>shoot(p), i*150/s); p.timer=0; }
            });

            state.bullets.forEach((b, i) => {
                if (b.isLobbed) {
                    b.progress += 0.02 * s;
                    b.x += 8 * s;
                    // Parabolic arc
                    let arc = Math.sin(b.progress * Math.PI) * 150;
                    let targetY = MOD_CONFIG.grid.sy + b.row * MOD_CONFIG.grid.ch + 30;
                    if (state.world === 'roof') {
                        let currentGx = (b.x - MOD_CONFIG.grid.sx) / MOD_CONFIG.grid.cw;
                        if (currentGx < 5) targetY -= (5 - currentGx) * 20;
                    }
                    b.el.style.left = b.x + 'px';
                    b.el.style.top = (targetY - arc) + 'px';
                } else {
                    b.x += 14*s; b.el.style.left = b.x+'px';
                    if (state.world === 'roof') {
                        let currentGx = (b.x - MOD_CONFIG.grid.sx) / MOD_CONFIG.grid.cw;
                        let roofY = MOD_CONFIG.grid.sy + b.row * MOD_CONFIG.grid.ch + 30;
                        if (currentGx < 5) roofY -= (5 - currentGx) * 20;
                        // If bullet is lower than roof at this point, and it's coming from a higher slope or lower slope...
                        // Simplify: if bullet gx is different from plant gx and they are on different slope levels
                        if (currentGx < 5 && Math.abs(currentGx - b.gx) > 0.5) {
                            let plantRoofY = MOD_CONFIG.grid.sy + b.row * MOD_CONFIG.grid.ch + 30;
                            if (b.gx < 5) plantRoofY -= (5 - b.gx) * 20;
                            if (roofY < plantRoofY - 10) { // Bullet hits the roof rising up
                                b.el.remove(); state.bullets.splice(i,1); return;
                            }
                        }
                    }
                }

                const hit = state.zombies.find(z=>z.row===b.row && Math.abs(z.x-b.x)<40);
                if (hit && (!b.isLobbed || b.progress > 0.5)) {
                    hit.hp -= 20; b.el.remove(); state.bullets.splice(i,1);
                    spawnParticle(b.x, b.el.offsetTop, b.type==='snow'?'ice-particle':'spark');
                    if(b.type==='snow') { hit.speed *= 0.5; hit.el.style.filter = 'hue-rotate(180deg) brightness(1.5)'; setTimeout(()=>{hit.speed *= 2; hit.el.style.filter='';}, 3000); }
                } else if(b.x > 1400 || (b.isLobbed && b.progress > 1.2)) { b.el.remove(); state.bullets.splice(i,1); }
            });
        }

        function spawnSun(p) { 
            const el = document.createElement('img'); el.src = 'images/Sun.gif'; el.className = 'sun-token'; 
            let x, y;
            if(p) { const pos = getCellPos(p.gx, p.gy); x = pos.x+20; y = pos.y; }
            else { x = 200+Math.random()*1000; y = -60; }
            el.style.left = x+'px'; el.style.top = y+'px'; layer.appendChild(el); 
            el.onclick = () => { state.sun += 50; updateUI(); playSnd('snd-sun'); gsap.to(el, {scale:0, duration:0.3, onComplete:()=>el.remove()}); }; 
            if(p) gsap.to(el, {x:(Math.random()-0.5)*80, y:"+=50", duration:1.2, ease:"bounce.out"}); 
            else gsap.to(el, {y:100+Math.random()*400, duration:4, ease:"none"}); 
            setTimeout(()=>{ if(el.parentElement) gsap.to(el, {opacity:0, onComplete:()=>el.remove()}); }, 8000); 
        }
        function spawnCoin(x, y) { const g = Math.random()>0.8, el = document.createElement('div'); el.className = 'coin-token'; el.style.left = x+'px'; el.style.top = y+'px'; el.style.background = g?'radial-gradient(circle, #f1c40f 0%, #f39c12 100%)':'radial-gradient(circle, #bdc3c7 0%, #95a5a6 100%)'; el.innerText = g?'G':'S'; layer.appendChild(el); el.onclick = () => { state.coins += g?50:10; updateUI(); playSnd('snd-sun'); gsap.to(el, {scale:0, onComplete:()=>el.remove()}); }; gsap.from(el, {y:"-=30", duration:0.5, ease:"bounce.out"}); setTimeout(()=>{ if(el.parentElement) gsap.to(el, {opacity:0, onComplete:()=>el.remove()}); }, 8000); }
        function shoot(p) { 
            if(!state.zombies.some(z=>z.row===p.gy && z.x > (255+p.gx*82))) return; 
            playSnd('snd-shoot'); 
            const d = MOD_CONFIG.plants.find(i=>i.id===p.id) || FUSION_DATA[p.id];
            const isLobbed = d && d.isPult;
            const el = document.createElement('img'); el.className = 'entity'; 
            el.src = isLobbed ? 'images/Sun.gif' : (p.projectile==='snow'?'images/SnowBullet.gif':'images/Bullet.gif'); // Placeholder for pult ammo
            el.style.width = '35px';
            const pos = getCellPos(p.gx, p.gy);
            el.style.left = (pos.x+55)+'px'; el.style.top = (pos.y+10)+'px'; layer.appendChild(el); 
            state.bullets.push({ el, x: (pos.x+55), y: (pos.y+10), startY: pos.y+10, row: p.gy, type: p.projectile, isLobbed, progress: 0, gx: p.gx }); 
        }
        function spawnZombieAt(gx, gy) { const zD = MOD_CONFIG.zombies[0], el = document.createElement('img'); el.src = `images/${zD.img}`; el.className = 'entity zombie'; const x = MOD_CONFIG.grid.sx+gx*MOD_CONFIG.grid.cw; el.style.left = x+'px'; el.style.top = (MOD_CONFIG.grid.sy+gy*MOD_CONFIG.grid.ch-80)+'px'; layer.appendChild(el); state.zombies.push({ el, x, row: gy, hp: zD.hp, type: zD.id, state: 'walk', speed: zD.speed*state.gameSpeed, isAir: false, canVault: false }); }
        function showWaveMsg(txt) { const el = document.getElementById('wave-msg'); el.innerText = txt; el.style.display = 'block'; gsap.fromTo(el, {scale:0}, {scale:1.2, duration:0.8, onComplete:()=>setTimeout(()=>gsap.to(el, {scale:2, opacity:0, onComplete:()=>el.style.display='none'}), 2000)}); }
    </script>
</body>
</html>
