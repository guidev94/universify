<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PVZ: Fusion RH - Elite Web Version</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: 'Bungee', cursive; }
        #game-view { position: relative; width: 900px; height: 600px; border: 4px solid #3e2723; background: #1a1a1a; overflow: hidden; }
        
        #bg { position: absolute; inset: 0; width: 1400px; height: 600px; z-index: 1; }

        /* Full Screen Name UI */
        #name-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.95);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 5000; transition: opacity 0.5s;
        }
        .wood-panel {
            background: #5d4037 url('https://www.transparenttextures.com/patterns/wood-pattern.png');
            border: 10px solid #3e2723; border-radius: 30px; padding: 60px;
            text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 40px rgba(0,0,0,0.5);
            transform: scale(0.9); opacity: 0;
        }
        .wood-panel h1 { color: #f4d03f; font-size: 42px; text-shadow: 4px 4px #000; margin-bottom: 40px; }
        .wood-panel input {
            background: #2b1b17; border: 5px solid #edc9af; border-radius: 15px;
            padding: 20px; color: #fff; font-family: 'Bungee'; font-size: 24px;
            text-align: center; width: 350px; outline: none; margin-bottom: 30px;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.5);
        }
        .btn-green {
            background: #4caf50; color: white; border: none; padding: 20px 60px;
            font-family: 'Bungee'; font-size: 28px; border-radius: 15px;
            cursor: pointer; border-bottom: 8px solid #2e7d32; transition: all 0.1s;
            text-shadow: 2px 2px #000;
        }
        .btn-green:hover { background: #66bb6a; }
        .btn-green:active { transform: translateY(6px); border-bottom-width: 0; }

        /* HUD & UI */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; }
        #seed-bank {
            position: absolute; top: 0; left: 10px; width: 450px; height: 90px;
            background: url('https://raw.githubusercontent.com/marblexu/PythonPlantsVsZombies/master/resources/graphics/Screen/SeedBank.png') no-repeat;
            background-size: contain; pointer-events: auto;
        }
        #sun-val { position: absolute; top: 62px; left: 32px; width: 75px; text-align: center; font-size: 20px; color: #000; font-weight: 900; }
        #seeds { margin-left: 110px; display: flex; gap: 4px; padding-top: 8px; }
        .seed { width: 52px; height: 75px; cursor: pointer; position: relative; border-radius: 3px; overflow: hidden; background: rgba(0,0,0,0.3); }
        .seed img { width: 100%; height: 100%; object-fit: contain; }
        .cd-overlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: rgba(0,0,0,0.7); z-index: 10; }
        
        #shovel-bank {
            position: absolute; top: 0; left: 470px; width: 75px; height: 85px;
            background: url('https://raw.githubusercontent.com/marblexu/PythonPlantsVsZombies/master/resources/graphics/Items/Shovel/ShovelBank.png') no-repeat;
            background-size: contain; pointer-events: auto; display: flex; align-items: center; justify-content: center;
        }
        #shovel-icon { width: 55px; cursor: pointer; transition: transform 0.2s; }
        #shovel-icon:hover { transform: rotate(-15deg); }

        #player-label {
            position: absolute; top: 15px; right: 20px; background: rgba(0,0,0,0.85); 
            padding: 8px 25px; border-radius: 25px; color: #f4d03f; font-size: 14px;
            border: 3px solid #edc9af; text-shadow: 2px 2px #000; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        #game-over {
            display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 10000; flex-direction: column; align-items: center; justify-content: center;
            color: #f44336; text-shadow: 4px 4px #000;
        }

        /* Entities */
        .entity { position: absolute; transform-origin: bottom center; }
        .bullet { position: absolute; width: 20px; height: 20px; z-index: 500; }
        .sun { position: absolute; width: 70px; height: 70px; z-index: 2000; cursor: pointer; }
        .zombie { position: absolute; width: 166px; height: 144px; transform: scale(0.8); }
    </style>
</head>
<body>
    <div id="game-view">
        <!-- Full Screen Name UI -->
        <div id="name-overlay">
            <div class="wood-panel" id="ui-panel">
                <h1>QUEM VAI DEFENDER O JARDIM?</h1>
                <input type="text" id="name-input" placeholder="DIGITE SEU NOME" maxlength="12">
                <br>
                <button class="btn-green" onclick="startGame()">VAMOS NESSA!</button>
            </div>
        </div>

        <img id="bg" src="https://raw.githubusercontent.com/marblexu/PythonPlantsVsZombies@master/resources/graphics/Items/Background/Background_1.jpg">

        <div id="hud">
            <div id="seed-bank">
                <div id="sun-val">100</div>
                <div id="seeds">
                    <div class="seed" onclick="selectPlant('sunflower')">
                        <div id="cd-sunflower" class="cd-overlay"></div>
                        <img src="https://cdn.jsdelivr.net/gh/Jasmine709/Plants-VS-Zombies-Game@main/images/Cards/Plants/SunFlower.png">
                    </div>
                    <div class="seed" onclick="selectPlant('peashooter')">
                        <div id="cd-peashooter" class="cd-overlay"></div>
                        <img src="https://cdn.jsdelivr.net/gh/Jasmine709/Plants-VS-Zombies-Game@main/images/Cards/Plants/Peashooter.png">
                    </div>
                    <div class="seed" onclick="selectPlant('wallnut')">
                        <div id="cd-wallnut" class="cd-overlay"></div>
                        <img src="https://cdn.jsdelivr.net/gh/Jasmine709/Plants-VS-Zombies-Game@main/images/Cards/Plants/WallNut.png">
                    </div>
                </div>
            </div>
            <div id="shovel-bank">
                <img id="shovel-icon" src="https://raw.githubusercontent.com/marblexu/PythonPlantsVsZombies/master/resources/graphics/Items/Shovel/Shovel_0.png" onclick="selectPlant('shovel')">
            </div>
            <div id="player-label">JOGADOR: <span id="p-name">...</span> | LVL: <span id="p-lvl">1</span></div>
        </div>

        <div id="game-layer" style="position: absolute; inset: 0; z-index: 10;"></div>

        <div id="game-over">
            <h1 style="font-size: 60px;">FIM DE JOGO</h1>
            <p style="font-size: 24px; color: #fff;">OS ZUMBIS INVADIRAM SUA CASA!</p>
            <button class="btn-green" style="margin-top: 40px;" onclick="location.reload()">TENTAR NOVAMENTE</button>
        </div>
    </div>

    <!-- Sounds -->
    <audio id="s-sun" src="https://cdn.jsdelivr.net/gh/jiangnangame/New-Plants-vs-Zombies-JavaScript@master/audio/points.mp3"></audio>
    <audio id="s-plant" src="https://cdn.jsdelivr.net/gh/jiangnangame/New-Plants-vs-Zombies-JavaScript@master/audio/plant1.mp3"></audio>
    <audio id="s-shoot" src="https://cdn.jsdelivr.net/gh/jiangnangame/New-Plants-vs-Zombies-JavaScript@master/audio/firepea.mp3"></audio>
    <audio id="s-chomp" src="https://cdn.jsdelivr.net/gh/jiangnangame/New-Plants-vs-Zombies-JavaScript@master/audio/chomp.mp3"></audio>
    <audio id="s-lose" src="https://cdn.jsdelivr.net/gh/jiangnangame/New-Plants-vs-Zombies-JavaScript@master/audio/losemusic.mp3"></audio>
    <audio id="s-ready" src="https://cdn.jsdelivr.net/gh/jiangnangame/New-Plants-vs-Zombies-JavaScript@master/audio/readysetplant.mp3"></audio>

    <script>
        const CONFIG = {
            grid: { rows: 5, cols: 9, sx: 130, sy: 100, cw: 82, ch: 100 },
            costs: { sunflower: 50, peashooter: 100, wallnut: 50, shovel: 0 },
            assets: {
                sunflower: 'https://cdn.jsdelivr.net/gh/Jasmine709/Plants-VS-Zombies-Game@main/images/Plants/SunFlower/SunFlower.gif',
                peashooter: 'https://cdn.jsdelivr.net/gh/Jasmine709/Plants-VS-Zombies-Game@main/images/Plants/Peashooter/Peashooter.gif',
                wallnut: 'https://cdn.jsdelivr.net/gh/Jasmine709/Plants-VS-Zombies-Game@main/images/Plants/WallNut/WallNut.gif',
                sunpea: 'https://patchwiki.biligame.com/images/pvzrh/4/43/9xqxxo3tjlpym0nbsia1h7z8fx6orl9.png',
                zombie: 'https://cdn.jsdelivr.net/gh/Jasmine709/Plants-VS-Zombies-Game@main/images/Zombies/Zombie/Zombie.gif',
                z_eat: 'https://cdn.jsdelivr.net/gh/Jasmine709/Plants-VS-Zombies-Game@main/images/Zombies/Zombie/ZombieAttack.gif',
                z_die: 'https://cdn.jsdelivr.net/gh/Jasmine709/Plants-VS-Zombies-Game@main/images/Zombies/Zombie/ZombieDie.gif',
                sun: 'https://cdn.jsdelivr.net/gh/Jasmine709/Plants-VS-Zombies-Game@main/images/interface/Sun.gif',
                bullet: 'https://cdn.jsdelivr.net/gh/Jasmine709/Plants-VS-Zombies-Game@main/images/Plants/PB00.gif'
            }
        };

        let game = {
            running: false,
            sun: 100,
            level: 1,
            name: '',
            plants: [],
            zombies: [],
            bullets: [],
            suns: [],
            dragging: null,
            killed: 0
        };

        const view = document.getElementById('game-view');
        const layer = document.getElementById('game-layer');

        window.onload = () => {
            gsap.to("#ui-panel", { scale: 1, opacity: 1, duration: 0.8, ease: "back.out" });
            const saved = localStorage.getItem('pvz_fusion_save');
            if (saved) {
                const data = JSON.parse(saved);
                document.getElementById('name-input').value = data.name;
                game.level = data.level;
            }
        };

        function play(id) {
            const a = document.getElementById('s-' + id);
            if (a) { a.currentTime = 0; a.play().catch(()=>{}); }
        }

        function startGame() {
            game.name = document.getElementById('name-input').value || "GUERREIRO";
            localStorage.setItem('pvz_fusion_save', JSON.stringify({ name: game.name, level: game.level }));
            
            document.getElementById('p-name').innerText = game.name.toUpperCase();
            document.getElementById('p-lvl').innerText = game.level;

            gsap.to("#name-overlay", { opacity: 0, duration: 0.5, onComplete: () => {
                document.getElementById('name-overlay').style.display = 'none';
                play('ready');
                game.running = true;
                runEngine();
            }});
        }

        function selectPlant(type) {
            if (!game.running || (type !== 'shovel' && game.sun < CONFIG.costs[type])) return;

            if (game.dragging) layer.removeChild(game.dragging.el);

            const el = document.createElement('img');
            el.src = type === 'shovel' ? document.getElementById('shovel-icon').src : CONFIG.assets[type];
            el.className = 'entity';
            el.style.zIndex = 5000;
            el.style.opacity = 0.7;
            el.style.pointerEvents = 'none';
            el.style.width = type === 'sunpea' ? '60px' : '75px';

            layer.appendChild(el);
            game.dragging = { type, el };

            document.onmousemove = (e) => {
                const r = view.getBoundingClientRect();
                el.style.left = (e.clientX - r.left - 35) + 'px';
                el.style.top = (e.clientY - r.top - 40) + 'px';
            };

            document.onmousedown = (e) => {
                if (e.button === 0) {
                    const r = view.getBoundingClientRect();
                    const gx = Math.floor((e.clientX - r.left - CONFIG.grid.sx) / CONFIG.grid.cw);
                    const gy = Math.floor((e.clientY - r.top - CONFIG.grid.sy) / CONFIG.grid.ch);

                    if (gx >= 0 && gx < 9 && gy >= 0 && gy < 5) placeOnGrid(gx, gy);
                    
                    if (game.dragging) layer.removeChild(el);
                    game.dragging = null;
                    document.onmousemove = null;
                    document.onmousedown = null;
                }
            };
        }

        function placeOnGrid(gx, gy) {
            const type = game.dragging.type;
            const idx = game.plants.findIndex(p => p.gx === gx && p.gy === gy);
            const exist = game.plants[idx];

            if (type === 'shovel') {
                if (exist) {
                    layer.removeChild(exist.el);
                    clearInterval(exist.timer);
                    game.plants.splice(idx, 1);
                    play('plant');
                }
                return;
            }

            if (exist) {
                // FUSION LOGIC
                const recipes = { sunflower: { peashooter: 'sunpea' }, peashooter: { sunflower: 'sunpea' } };
                const res = recipes[exist.type]?.[type];
                if (res) {
                    game.sun -= CONFIG.costs[type];
                    layer.removeChild(exist.el);
                    clearInterval(exist.timer);
                    game.plants.splice(idx, 1);
                    createPlant(res, gx, gy);
                    play('plant');
                }
            } else {
                game.sun -= CONFIG.costs[type];
                createPlant(type, gx, gy);
                play('plant');
            }
        }

        function createPlant(type, gx, gy) {
            const el = document.createElement('img');
            el.src = CONFIG.assets[type];
            el.className = 'entity';
            el.style.left = (CONFIG.grid.sx + gx * CONFIG.grid.cw) + 'px';
            el.style.top = (CONFIG.grid.sy + gy * CONFIG.grid.ch) + 'px';
            el.style.zIndex = 100 + gy;
            el.style.width = type === 'sunpea' ? '60px' : '75px';
            layer.appendChild(el);

            gsap.from(el, { scale: 0, duration: 0.4, ease: "back.out(2)" });

            const p = {
                type, gx, gy, el, hp: type === 'wallnut' ? 400 : 100,
                timer: setInterval(() => {
                    if (!game.running) return;
                    if (type.includes('sun')) spawnSun(gx, gy);
                    if (type.includes('pea')) {
                        if (game.zombies.some(z => z.gy === gy && z.x > (CONFIG.grid.sx + gx * CONFIG.grid.cw))) {
                            spawnBullet(gx, gy);
                        }
                    }
                }, 3000)
            };
            game.plants.push(p);
        }

        function spawnSun(gx, gy) {
            const el = document.createElement('img');
            el.src = CONFIG.assets.sun;
            el.className = 'sun';
            el.style.left = (CONFIG.grid.sx + gx * CONFIG.grid.cw + 20) + 'px';
            el.style.top = (CONFIG.grid.sy + gy * CONFIG.grid.ch - 20) + 'px';
            el.onclick = () => {
                play('sun');
                game.sun += 25;
                gsap.to(el, { x: -el.offsetLeft + 40, y: -el.offsetTop + 40, opacity: 0, duration: 0.6, onComplete: () => {
                    if (el.parentNode) layer.removeChild(el);
                    game.suns = game.suns.filter(s => s.el !== el);
                }});
            };
            layer.appendChild(el);
            game.suns.push({ el });
            gsap.to(el, { y: "+=50", duration: 1, ease: "bounce.out" });
        }

        function spawnBullet(gx, gy) {
            play('shoot');
            const el = document.createElement('img');
            el.src = CONFIG.assets.bullet;
            el.className = 'bullet';
            el.style.left = (CONFIG.grid.sx + gx * CONFIG.grid.cw + 50) + 'px';
            el.style.top = (CONFIG.grid.sy + gy * CONFIG.grid.ch + 15) + 'px';
            layer.appendChild(el);
            game.bullets.push({ el, x: CONFIG.grid.sx + gx * CONFIG.grid.cw + 50, gy });
        }

        function spawnZombie() {
            const gy = Math.floor(Math.random() * 5);
            const el = document.createElement('img');
            el.src = CONFIG.assets.zombie;
            el.className = 'zombie';
            el.style.left = '900px';
            el.style.top = (CONFIG.grid.sy + gy * CONFIG.grid.ch - 30) + 'px';
            el.style.zIndex = 1000 + gy;
            layer.appendChild(el);
            game.zombies.push({ el, x: 900, gy, hp: 10 });
        }

        function runEngine() {
            setInterval(() => {
                if (!game.running) return;

                if (Math.random() < 0.003 + (game.level * 0.001)) spawnZombie();

                document.getElementById('sun-val').innerText = game.sun;

                // Zombies logic
                game.zombies.forEach(z => {
                    const target = game.plants.find(p => p.gy === z.gy && Math.abs((CONFIG.grid.sx + p.gx * CONFIG.grid.cw) - z.x) < 40);
                    if (target) {
                        if (z.el.src !== CONFIG.assets.z_eat) z.el.src = CONFIG.assets.z_eat;
                        target.hp -= 0.4;
                        if (Math.random() < 0.05) play('chomp');
                        if (target.hp <= 0) {
                            layer.removeChild(target.el);
                            clearInterval(target.timer);
                            game.plants = game.plants.filter(p => p !== target);
                            z.el.src = CONFIG.assets.zombie;
                        }
                    } else {
                        z.x -= 0.5;
                        z.el.style.left = z.x + 'px';
                    }
                    if (z.x < 50) endGame();
                });

                // Bullets logic
                game.bullets.forEach((b, bi) => {
                    b.x += 7;
                    b.el.style.left = b.x + 'px';
                    const hit = game.zombies.find(z => z.gy === b.gy && Math.abs(z.x - b.x) < 30);
                    if (hit) {
                        hit.hp -= 2;
                        layer.removeChild(b.el);
                        game.bullets.splice(bi, 1);
                        if (hit.hp <= 0) {
                            hit.el.src = CONFIG.assets.z_die;
                            game.killed++;
                            setTimeout(() => {
                                if (hit.el.parentNode) layer.removeChild(hit.el);
                                game.zombies = game.zombies.filter(z => z !== hit);
                            }, 1500);
                            checkWin();
                        }
                    }
                    if (b.x > 950) { if (b.el.parentNode) layer.removeChild(b.el); game.bullets.splice(bi, 1); }
                });
            }, 20);
        }

        function checkWin() {
            if (game.killed >= 5 + game.level * 2) {
                game.running = false;
                game.level++;
                localStorage.setItem('pvz_fusion_save', JSON.stringify({ name: game.name, level: game.level }));
                alert("NÍVEL COMPLETO! PRÓXIMO: " + game.level);
                location.reload();
            }
        }

        function endGame() {
            game.running = false;
            play('lose');
            document.getElementById('game-over').style.display = 'flex';
        }
    </script>
</body>
</html>
