<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plants vs Zombies: Fusion RH Web</title>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: 'Bungee', cursive; }
        #game-container { position: relative; width: 900px; height: 600px; border: 6px solid #3e2723; background: #1a1a1a; box-shadow: 0 0 50px rgba(0,0,0,1); overflow: hidden; }
        
        #bg { position: absolute; top: 0; left: 0; width: 1400px; height: 600px; }

        /* Name Overlay */
        #name-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 2000;
        }
        .wood-box {
            background: #5d4037; border: 8px solid #3e2723; border-radius: 20px; padding: 40px;
            text-align: center; box-shadow: 0 20px 0 #2b1b17;
        }
        .wood-box h2 { color: #f4d03f; font-size: 32px; text-shadow: 3px 3px #000; margin-bottom: 30px; }
        .wood-box input {
            background: #3e2723; border: 4px solid #edc9af; border-radius: 10px;
            padding: 15px; color: #fff; font-family: 'Bungee'; font-size: 20px;
            text-align: center; width: 300px; outline: none; margin-bottom: 20px;
        }
        .btn-start {
            background: #4caf50; color: white; border: none; padding: 15px 40px;
            font-family: 'Bungee'; font-size: 24px; border-radius: 10px;
            cursor: pointer; border-bottom: 6px solid #2e7d32; transition: all 0.1s;
        }
        .btn-start:active { transform: translateY(4px); border-bottom-width: 0; }

        /* HUD */
        #seed-bank {
            position: absolute; top: 0; left: 10px; z-index: 1000;
            width: 450px; height: 85px; background: url('https://raw.githubusercontent.com/marblexu/PythonPlantsVsZombies/master/resources/graphics/Screen/SeedBank.png') no-repeat;
            background-size: contain; display: flex; align-items: flex-start; padding-top: 5px;
        }
        #sun-count {
            position: absolute; top: 60px; left: 32px; width: 75px;
            text-align: center; font-size: 18px; color: #000; font-weight: bold;
        }
        #seed-chooser { margin-left: 110px; display: flex; gap: 2px; }
        .seed-slot {
            width: 50px; height: 70px; cursor: pointer; position: relative;
            background: rgba(0,0,0,0.2); border-radius: 2px;
        }
        .seed-slot img { width: 100%; height: 100%; object-fit: contain; }
        .cooldown {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 0%;
            background: rgba(0,0,0,0.7); pointer-events: none; z-index: 5;
        }

        #user-hud {
            position: absolute; top: 10px; right: 110px; z-index: 1000;
            background: rgba(0,0,0,0.8); padding: 5px 15px; border-radius: 20px;
            color: #f4d03f; font-size: 12px; border: 2px solid #edc9af;
        }
        
        #shovel-bank {
            position: absolute; top: 0; left: 470px; z-index: 1000;
            width: 70px; height: 80px; background: url('https://raw.githubusercontent.com/marblexu/PythonPlantsVsZombies/master/resources/graphics/Items/Shovel/ShovelBank.png') no-repeat;
            background-size: contain; display: flex; align-items: center; justify-content: center;
        }
        #shovel { width: 50px; cursor: pointer; }

        /* Game Over */
        #game-over-overlay {
            display: none; position: absolute; inset: 0;
            background: rgba(0,0,0,0.9); z-index: 5000;
            flex-direction: column; align-items: center; justify-content: center;
            color: #f44336; text-align: center;
        }
    </style>
</head>
<body ondragstart="return false">
    <div id="game-container">
        <div id="name-overlay">
            <div class="wood-box">
                <h2>BEM-VINDO AO PVZ FUSION</h2>
                <input type="text" id="player-name-input" placeholder="SEU NOME" maxlength="12">
                <br>
                <button class="btn-start" onclick="confirmName()">PRONTO!</button>
            </div>
        </div>

        <img id="bg" src="https://raw.githubusercontent.com/marblexu/PythonPlantsVsZombies/master/resources/graphics/Items/Background/Background_0.jpg" alt="">

        <div id="seed-bank">
            <div id="sun-count">50</div>
            <div id="seed-chooser">
                <div class="seed-slot" onclick="pickPlant('peashooter')">
                    <div id="cd-peashooter" class="cooldown"></div>
                    <img src="https://cdn.jsdelivr.net/gh/Jasmine709/Plants-VS-Zombies-Game@main/images/Cards/Plants/Peashooter.png">
                </div>
                <div class="seed-slot" onclick="pickPlant('sunflower')">
                    <div id="cd-sunflower" class="cooldown"></div>
                    <img src="https://cdn.jsdelivr.net/gh/Jasmine709/Plants-VS-Zombies-Game@main/images/Cards/Plants/SunFlower.png">
                </div>
                <div class="seed-slot" onclick="pickPlant('wallnut')">
                    <div id="cd-wallnut" class="cooldown"></div>
                    <img src="https://cdn.jsdelivr.net/gh/Jasmine709/Plants-VS-Zombies-Game@main/images/Cards/Plants/WallNut.png">
                </div>
            </div>
        </div>

        <div id="shovel-bank">
            <img id="shovel" src="https://raw.githubusercontent.com/marblexu/PythonPlantsVsZombies/master/resources/graphics/Items/Shovel/Shovel_0.png" onclick="pickPlant('shovel')">
        </div>

        <div id="user-hud">
            JOGADOR: <span id="username-display">...</span> | NÍVEL: <span id="level-display">1</span>
        </div>

        <div id="entities-layer"></div>

        <div id="game-over-overlay">
            <h1>OS ZUMBIS COMERAM SEUS CÉREBROS!</h1>
            <button class="btn-start" onclick="location.reload()">RECOMECAR</button>
        </div>
    </div>

    <!-- Audio -->
    <audio id="snd-points" src="https://cdn.jsdelivr.net/gh/jiangnangame/New-Plants-vs-Zombies-JavaScript@master/audio/points.mp3"></audio>
    <audio id="snd-plant" src="https://cdn.jsdelivr.net/gh/jiangnangame/New-Plants-vs-Zombies-JavaScript@master/audio/plant1.mp3"></audio>
    <audio id="snd-shoot" src="https://cdn.jsdelivr.net/gh/jiangnangame/New-Plants-vs-Zombies-JavaScript@master/audio/firepea.mp3"></audio>
    <audio id="snd-chomp" src="https://cdn.jsdelivr.net/gh/jiangnangame/New-Plants-vs-Zombies-JavaScript@master/audio/chomp.mp3"></audio>
    <audio id="snd-lose" src="https://cdn.jsdelivr.net/gh/jiangnangame/New-Plants-vs-Zombies-JavaScript@master/audio/losemusic.mp3"></audio>

    <script>
        // CONFIGURAÇÕES E ESTADO
        const GRID = { rows: 5, cols: 9, sx: 140, sy: 100, cw: 82, ch: 100 };
        const ASSETS = {
            peashooter: 'https://cdn.jsdelivr.net/gh/Jasmine709/Plants-VS-Zombies-Game@main/images/Plants/Peashooter/Peashooter.gif',
            sunflower: 'https://cdn.jsdelivr.net/gh/Jasmine709/Plants-VS-Zombies-Game@main/images/Plants/SunFlower/SunFlower.gif',
            wallnut: 'https://cdn.jsdelivr.net/gh/Jasmine709/Plants-VS-Zombies-Game@main/images/Plants/WallNut/WallNut.gif',
            sunpea: 'https://patchwiki.biligame.com/images/pvzrh/4/43/9xqxxo3tjlpym0nbsia1h7z8fx6orl9.png',
            zombie: 'https://cdn.jsdelivr.net/gh/Jasmine709/Plants-VS-Zombies-Game@main/images/Zombies/Zombie/Zombie.gif',
            zombie_die: 'https://cdn.jsdelivr.net/gh/Jasmine709/Plants-VS-Zombies-Game@main/images/Zombies/Zombie/ZombieDie.gif',
            sun: 'https://cdn.jsdelivr.net/gh/Jasmine709/Plants-VS-Zombies-Game@main/images/interface/Sun.gif',
            bullet: 'https://cdn.jsdelivr.net/gh/Jasmine709/Plants-VS-Zombies-Game@main/images/Plants/PB00.gif'
        };

        let state = {
            sun: 100,
            level: 1,
            playerName: '',
            gameRunning: false,
            plants: [],
            zombies: [],
            bullets: [],
            suns: [],
            dragging: null,
            zombiesKilled: 0
        };

        const container = document.getElementById('game-container');
        const entitiesLayer = document.getElementById('entities-layer');
        const sunDisplay = document.getElementById('sun-count');

        // AUDIO HELPERS
        function playSnd(id) {
            const el = document.getElementById(id);
            if (el) { el.currentTime = 0; el.play().catch(()=>{}); }
        }

        // INICIALIZAÇÃO
        window.onload = function() {
            let saved = localStorage.getItem('pvz_fusion_save');
            if (saved) {
                let data = JSON.parse(saved);
                state.playerName = data.name;
                state.level = data.level;
                document.getElementById('name-overlay').style.display = 'none';
                initGame();
            }
        };

        function confirmName() {
            const name = document.getElementById('player-name-input').value || "Jogador";
            state.playerName = name;
            localStorage.setItem('pvz_fusion_save', JSON.stringify({ name, level: 1 }));
            document.getElementById('name-overlay').style.display = 'none';
            playSnd('snd-plant');
            initGame();
        }

        function initGame() {
            document.getElementById('username-display').innerText = state.playerName.toUpperCase();
            document.getElementById('level-display').innerText = state.level;
            state.gameRunning = true;
            startGameLoop();
        }

        function pickPlant(type) {
            if (!state.gameRunning) return;
            const costs = { peashooter: 100, sunflower: 50, wallnut: 50, shovel: 0 };
            if (type !== 'shovel' && state.sun < costs[type]) return;

            if (state.dragging) entitiesLayer.removeChild(state.dragging.visual);

            const visual = document.createElement('img');
            visual.src = type === 'shovel' ? document.getElementById('shovel').src : ASSETS[type];
            visual.style.position = 'absolute';
            visual.style.zIndex = '5000';
            visual.style.pointerEvents = 'none';
            visual.style.opacity = '0.7';
            if (type === 'sunpea') visual.style.width = '60px';
            else visual.style.width = '70px';

            entitiesLayer.appendChild(visual);
            state.dragging = { type, visual };

            document.onmousemove = (e) => {
                const rect = container.getBoundingClientRect();
                visual.style.left = (e.clientX - rect.left - 35) + 'px';
                visual.style.top = (e.clientY - rect.top - 35) + 'px';
            };

            document.onmousedown = (e) => {
                if (e.button === 0) {
                    const rect = container.getBoundingClientRect();
                    const gx = Math.floor((e.clientX - rect.left - GRID.sx) / GRID.cw);
                    const gy = Math.floor((e.clientY - rect.top - GRID.sy) / GRID.ch);

                    if (gx >= 0 && gx < GRID.cols && gy >= 0 && gy < GRID.rows) {
                        handleGridClick(gx, gy);
                    }
                    
                    entitiesLayer.removeChild(visual);
                    state.dragging = null;
                    document.onmousemove = null;
                    document.onmousedown = null;
                }
            };
        }

        function handleGridClick(gx, gy) {
            const existingIdx = state.plants.findIndex(p => p.gx === gx && p.gy === gy);
            const existing = state.plants[existingIdx];

            if (state.dragging.type === 'shovel') {
                if (existing) {
                    entitiesLayer.removeChild(existing.el);
                    clearInterval(existing.timer);
                    state.plants.splice(existingIdx, 1);
                }
                return;
            }

            const type = state.dragging.type;
            const costs = { peashooter: 100, sunflower: 50, wallnut: 50 };
            
            if (existing) {
                // FUSION
                if ((existing.type === 'sunflower' && type === 'peashooter') || 
                    (existing.type === 'peashooter' && type === 'sunflower')) {
                    state.sun -= costs[type];
                    entitiesLayer.removeChild(existing.el);
                    clearInterval(existing.timer);
                    state.plants.splice(existingIdx, 1);
                    createPlant('sunpea', gx, gy);
                    playSnd('snd-plant');
                }
            } else {
                state.sun -= costs[type];
                createPlant(type, gx, gy);
                playSnd('snd-plant');
            }
        }

        function createPlant(type, gx, gy) {
            const el = document.createElement('img');
            el.src = ASSETS[type];
            el.style.position = 'absolute';
            el.style.left = (GRID.sx + gx * GRID.cw) + 'px';
            el.style.top = (GRID.sy + gy * GRID.ch) + 'px';
            el.style.zIndex = 100 + gy;
            if (type === 'sunpea') el.style.width = '60px';
            else el.style.width = '75px';
            
            entitiesLayer.appendChild(el);

            const plant = {
                type, gx, gy, el, hp: type === 'wallnut' ? 400 : 100,
                timer: setInterval(() => plantAction(plant), 3000)
            };
            state.plants.push(plant);
        }

        function plantAction(p) {
            if (!state.gameRunning) return;
            if (p.type === 'sunflower' || p.type === 'sunpea') {
                spawnSun(p.gx, p.gy);
            }
            if (p.type === 'peashooter' || p.type === 'sunpea') {
                if (state.zombies.some(z => z.gy === p.gy && z.x > (GRID.sx + p.gx * GRID.cw))) {
                    spawnBullet(p.gx, p.gy);
                }
            }
        }

        function spawnSun(gx, gy) {
            const el = document.createElement('img');
            el.src = ASSETS.sun;
            el.style.position = 'absolute';
            el.style.left = (GRID.sx + gx * GRID.cw + 20) + 'px';
            el.style.top = (GRID.sy + gy * GRID.ch) + 'px';
            el.style.zIndex = 2000;
            el.style.cursor = 'pointer';
            el.onclick = () => {
                playSnd('snd-points');
                state.sun += 25;
                entitiesLayer.removeChild(el);
                state.suns = state.suns.filter(s => s.el !== el);
            };
            entitiesLayer.appendChild(el);
            state.suns.push({ el, y: GRID.sy + gy * GRID.ch, targetY: GRID.sy + gy * GRID.ch + 40 });
        }

        function spawnBullet(gx, gy) {
            playSnd('snd-shoot');
            const el = document.createElement('img');
            el.src = ASSETS.bullet;
            el.style.position = 'absolute';
            el.style.left = (GRID.sx + gx * GRID.cw + 40) + 'px';
            el.style.top = (GRID.sy + gy * GRID.ch + 10) + 'px';
            el.style.zIndex = 500;
            entitiesLayer.appendChild(el);
            state.bullets.push({ el, x: GRID.sx + gx * GRID.cw + 40, gy });
        }

        function spawnZombie() {
            const gy = Math.floor(Math.random() * 5);
            const el = document.createElement('img');
            el.src = ASSETS.zombie;
            el.style.position = 'absolute';
            el.style.left = '900px';
            el.style.top = (GRID.sy + gy * GRID.ch - 20) + 'px';
            el.style.zIndex = 1000 + gy;
            entitiesLayer.appendChild(el);
            state.zombies.push({ el, x: 900, gy, hp: 10 });
        }

        function startGameLoop() {
            setInterval(() => {
                if (!state.gameRunning) return;

                // Spawn
                if (Math.random() < 0.003 + (state.level * 0.001)) spawnZombie();

                // Move Zombies
                state.zombies.forEach(z => {
                    let target = state.plants.find(p => p.gy === z.gy && Math.abs((GRID.sx + p.gx * GRID.cw) - z.x) < 40);
                    if (target) {
                        target.hp -= 0.5;
                        if (Math.random() < 0.1) playSnd('snd-chomp');
                        if (target.hp <= 0) {
                            entitiesLayer.removeChild(target.el);
                            clearInterval(target.timer);
                            state.plants = state.plants.filter(p => p !== target);
                        }
                    } else {
                        z.x -= 0.5;
                        z.el.style.left = z.x + 'px';
                    }
                    if (z.x < 50) gameOver();
                });

                // Move Bullets
                state.bullets.forEach((b, bi) => {
                    b.x += 6;
                    b.el.style.left = b.x + 'px';
                    
                    let hit = state.zombies.find(z => z.gy === b.gy && Math.abs(z.x - b.x) < 30);
                    if (hit) {
                        hit.hp -= 2;
                        entitiesLayer.removeChild(b.el);
                        state.bullets.splice(bi, 1);
                        if (hit.hp <= 0) {
                            hit.el.src = ASSETS.zombie_die;
                            state.zombiesKilled++;
                            setTimeout(() => {
                                try { entitiesLayer.removeChild(hit.el); } catch(e){}
                                state.zombies = state.zombies.filter(z => z !== hit);
                            }, 2000);
                            checkWin();
                        }
                    }
                    if (b.x > 900) {
                        entitiesLayer.removeChild(b.el);
                        state.bullets.splice(bi, 1);
                    }
                });

                // Sun
                state.suns.forEach(s => {
                    if (parseFloat(s.el.style.top) < s.targetY) {
                        s.el.style.top = (parseFloat(s.el.style.top) + 1) + 'px';
                    }
                });

                sunDisplay.innerText = state.sun;
            }, 20);
        }

        function checkWin() {
            if (state.zombiesKilled >= 5 + state.level * 2) {
                state.gameRunning = false;
                state.level++;
                localStorage.setItem('pvz_fusion_save', JSON.stringify({ name: state.playerName, level: state.level }));
                alert("Nível Completo! Avançando para o Nível " + state.level);
                location.reload();
            }
        }

        function gameOver() {
            state.gameRunning = false;
            playSnd('snd-lose');
            document.getElementById('game-over-overlay').style.display = 'flex';
        }
    </script>
</body>
</html>
